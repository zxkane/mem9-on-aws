name: Synthetic artifact channel smoke
description: Synthetic R7 winner channel using a private local choice surrogate; no S3 or production authority.
inputs:
  contender:
    description: Fixed parallel contender, a or b.
    required: true
  challenge:
    description: Synthetic random 64-hex dispatch binding.
    required: true
  github-token:
    description: Read-only job token for GitHub metadata.
    required: true
outputs:
  diagnostic:
    description: Synthetic inbox commitments only.
  receipt:
    description: Synthetic channel observation; not an authorization or transferable capability.
  marker:
    description: AWS_SIMULATED_MARKER is 1 only for the selected original process; no AWS call occurs.
runs:
  using: node24
  main: index.mjs
