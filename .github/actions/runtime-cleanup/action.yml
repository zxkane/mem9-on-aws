name: Remove runtime rehearsal
description: Refresh preview credentials and remove only the disposable rehearsal stage.
inputs:
  role-arn:
    required: true
    description: Existing preview deployment role
  region:
    required: true
    description: Application region
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        mask-aws-account-id: true
    - shell: bash
      run: node scripts/run-production-runtime.mjs cleanup-preview
