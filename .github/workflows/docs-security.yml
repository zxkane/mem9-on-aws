name: Documentation Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Runbook & Public-Content Scan
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate README shell blocks
        shell: bash
        run: |
          set -euo pipefail
          awk '
            BEGIN { in_block = 0 }
            /^```bash$/ { in_block = 1; next }
            /^```$/ {
              if (in_block) {
                in_block = 0
                print ""
              }
              next
            }
            in_block { print }
          ' README.md | bash -n

      - name: Validate PITR runbook invariants
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "restore-db-cluster-to-point-in-time"
            "--restore-to-time"
            "aws rds create-db-instance"
            "vector(1024)"
            "create-db-cluster-snapshot"
            "MEM9_RECOVERY_DB_CLUSTER_IDENTIFIER"
            "E2E_EXPECTED_DB_CLUSTER_IDENTIFIER"
            "scripts/run-bootstrap-task.sh"
            "unset MEM9_RECOVERY_DB_CLUSTER_IDENTIFIER"
          )
          for text in "${required[@]}"; do
            if ! grep -Fq -- "$text" README.md; then
              echo "::error::PITR runbook is missing required content: $text"
              exit 1
            fi
          done

      - name: Scan every changed path and historical blob
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DIFF_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the public-artifact scan head"
            exit 1
          fi
          if [[ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]]; then
            DIFF_BASE="$(git rev-parse "$DIFF_HEAD^")"
          fi
          if [[ ! "$DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the public-artifact scan base"
            exit 1
          fi
          node scripts/scan-public-artifacts.mjs \
            --git-range "$DIFF_BASE" "$DIFF_HEAD"
