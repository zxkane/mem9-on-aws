      - id: ci_smoke_guard_5938f53d50ce
        name: "Verify smoke phase receipt: Human namespace OAuth E2E (preview, hard)"
        shell: bash
        if: success() && (steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != '')
        env:
          MEM9_CI_SMOKE_ROUTE: deploy-preview
          MEM9_CI_SMOKE_STEP: deploy-preview/24
          MEM9_CI_SMOKE_PHASE: prereadiness
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false

      - name: Human namespace OAuth E2E (preview, hard)
        if: success() && steps.ci_smoke_guard_5938f53d50ce.outcome == 'success' && (steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != '')
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
          EXPECTED_HUMAN_IMAGE_TAG: ${{ needs.build-human-acceptance-image.outputs.image_tag }}
        run: bash scripts/run-human-namespace-preview-e2e.sh
        continue-on-error: false

      - name: Cancel outstanding runtime bootstrap invocations
        if: always() && (failure() || cancelled()) && steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: node scripts/run-runtime-preview.mjs cancel
      - id: ci_smoke_guard_dcc375938714
        name: "Verify smoke phase receipt: Comment deploy status"
        shell: bash
        if: success() && (always() && steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != '')
        env:
          MEM9_CI_SMOKE_ROUTE: deploy-preview
          MEM9_CI_SMOKE_STEP: deploy-preview/26
          MEM9_CI_SMOKE_PHASE: prereadiness
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false

      - name: Comment deploy status
        if: success() && steps.ci_smoke_guard_dcc375938714.outcome == 'success' && (always() && steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
          # Overall job status includes reconciliation and any later verification,
          # not just the earlier SST command.
          DEPLOY_STATUS: ${{ job.status }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const stage = process.env.STAGE;
            const status = process.env.DEPLOY_STATUS;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = status === 'success' ? '✅' : '❌';
            const body = [
              `## ${icon} Preview Deployment`,
              '',
              `| Item | Value |`,
              `|------|-------|`,
              `| Stage | \`${stage}\` |`,
              `| Status | ${status} |`,
              `| Region | \`${process.env.AWS_REGION}\` |`,
              `| Run | [View logs](${runUrl}) |`,
              '',
              `SSM parameters deployed by this stage: \`/mem9-on-aws/${stage}/...\``,
              '',
              `*The preview is removed automatically when the PR is closed.*`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
        continue-on-error: false
      - name: Remove owned CI smoke source evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-source

  # ───────────────────────────────────────────────────────────────────────────
  # cleanup-failed-preview — teardown runs independently after a preview deploy
  # job fails or times out, so that job's timeout cannot kill sst remove.
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-failed-preview:
    name: Cleanup Failed PR Preview
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    needs: [ application-region, deploy-preview ]
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main' && needs.deploy-preview.result != 'success' && needs.deploy-preview.outputs.stage != ''
    # Inner worst case is 55m: two 15m removes and one 22m ENI wait, each with
    # a 60s kill-after allowance. Keep 15m for checkout, install, OIDC, unlock,
    # and process startup so the job timeout cannot pre-empt the final retry.
    timeout-minutes: 70
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      STAGE: ${{ needs.deploy-preview.outputs.stage }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_PREVIEW_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping failed preview cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::AWS_PREVIEW_ROLE_ARN not configured — skipping failed preview cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.skip != 'true'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.gate.outputs.skip != 'true'
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm -C infra install --frozen-lockfile

      - name: Install root dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Remove conflicting Pulumi installation
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo rm -f /usr/local/bin/pulumi* 2>/dev/null || true
          rm -rf ~/.pulumi/plugins/ 2>/dev/null || true
          rm -rf ~/.config/sst/bin/ ~/.config/sst/plugins/ 2>/dev/null || true

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Remove failed PR stage
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if ! [[ "$STAGE" =~ ^pr-[0-9]+$ ]]; then
            echo "::error::Refusing to remove invalid or protected stage $STAGE"
            exit 1
          fi
          # Clear the stale lock once. It must remain outside remove(): the
          # timed-out Pulumi child may still own the lock until kill-after fires.
          pnpm -C infra exec sst unlock --stage "$STAGE" 2>&1 || true

          remove() {
            timeout --kill-after=60s "$1" \
              pnpm -C infra exec sst remove --stage "$STAGE" --print-logs
          }
          if remove 15m; then
            echo "::notice::Removed failed stage ${STAGE} on the first attempt"
            exit 0
          fi
          echo "::notice::First remove of ${STAGE} did not finish — waiting for Lambda ENIs to detach, then retrying"
          timeout --kill-after=60s 22m node scripts/await-eni-detach.mts "$STAGE" || \
            echo "::warning::ENI detach wait exceeded its outer bound — retrying the remove anyway"
          if timeout --kill-after=30s 3m node scripts/await-sst-stage-removal.mts "$STAGE"; then
            echo "::notice::Original remove completed while ${STAGE} dependencies settled"
            exit 0
          fi
          if remove 15m; then
            exit 0
          fi
          # An orphaned Pulumi child can finish immediately after a retry reports
          # the still-held SST lock. Do not force-unlock a possibly live engine;
          # accept the cleanup only when the stage state actually disappears.
          if timeout --kill-after=30s 3m node scripts/await-sst-stage-removal.mts "$STAGE"; then
            echo "::notice::Original remove completed after the retry returned"
            exit 0
          fi
          echo "::error::Failed stage ${STAGE} still has SST state or stage-owned AWS resources after cleanup attempts"
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # cleanup-preview — PR closed/merged → remove stage `pr-N`.
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-preview:
    name: Cleanup PR Preview
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    needs: [ application-region ]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.base.ref == 'main'
    # Budget: 15m first remove + up to 20m ENI detach wait + 15m retry, plus
    # checkout/pnpm/install. The old 30m cut the FIRST remove off mid-flight (#146),
    # which is what leaked the security groups — the job timeout must stay strictly
    # above the sum of the inner bounds so the retry path can always complete.
    timeout-minutes: 70
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: ${{ needs.application-region.outputs.cleanup_region }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_PREVIEW_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::AWS_PREVIEW_ROLE_ARN not configured — skipping cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check if stage was ever deployed
        id: check-state
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          STAGE="pr-${PR_NUMBER}"

          # SST writes bootstrap config to /sst/bootstrap (SSM) on first deploy
          # per region. Reading from SSM is deterministic — unlike scanning
          # buckets, which could match a sibling project's state bucket.
          BOOTSTRAP_JSON=$(aws ssm get-parameter \
            --name /sst/bootstrap \
            --query Parameter.Value \
            --output text 2>/dev/null || true)

          if [[ -z "$BOOTSTRAP_JSON" ]]; then
            echo "::notice::No /sst/bootstrap in ${AWS_REGION} — stage was never deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATE_BUCKET=$(echo "$BOOTSTRAP_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
          if [[ -z "$STATE_BUCKET" ]]; then
            echo "::error::Could not parse 'state' from /sst/bootstrap"
            exit 1
          fi

          STATE_KEY="app/mem9-on-aws/${STAGE}.json"
          echo "Looking up s3://${STATE_BUCKET}/${STATE_KEY}"
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "Pulumi state found for ${STAGE} — cleanup required"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No state for ${STAGE} — stage was never deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check-state.outputs.deployed == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.check-state.outputs.deployed == 'true'
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.check-state.outputs.deployed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        if: steps.check-state.outputs.deployed == 'true'
        run: pnpm -C infra install --frozen-lockfile

      - name: Install root dependencies
        if: steps.check-state.outputs.deployed == 'true'
        run: npm ci

      - name: Remove conflicting Pulumi installation
        if: steps.check-state.outputs.deployed == 'true'
        run: |
          sudo rm -f /usr/local/bin/pulumi* 2>/dev/null || true
          rm -rf ~/.config/sst/bin/ ~/.config/sst/plugins/ 2>/dev/null || true

      # #146. `sst remove` deletes the VPC-attached Lambdas quickly, but AWS
      # detaches their hyperplane ENIs ASYNCHRONOUSLY (up to ~20m). Those ENIs hold
      # a dependency on Mem9TaskSg, so Pulumi sits retrying DeleteSecurityGroup
      # against DependencyViolation — and on the stages that leaked, THIS JOB'S
      # timeout fired first and cancelled the remove MID-FLIGHT. The state object
      # was already gone by then, so the stage became invisible to a state-anchored
      # reconciler and its SG + ENIs leaked with nothing tying them to a closed PR.
      #
      # So the remove gets its OWN bound (`timeout`), which the job timeout must
      # never pre-empt. A first attempt that runs out is not a failure: the
      # functions are deleted by then, which is precisely when waiting for the ENIs
      # becomes useful (before the remove they are still in-use — waiting there
      # would poll for 20 minutes and change nothing). Then one retry finishes the
      # remove with the dependency gone, leaving SST state consistent.
      - name: Remove PR stage
        if: steps.check-state.outputs.deployed == 'true'
        shell: bash
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          STAGE="pr-${PR_NUMBER}"
          # Refuse to remove a protected stage name.
          case "$STAGE" in
            prod|main|production) echo "::error::Refusing to remove protected stage $STAGE"; exit 1 ;;
          esac
          # Clear a stale lock left by a previous run — ONCE, before the first
          # attempt. It must not move inside `remove()`: `timeout` sends only
          # SIGTERM, and `sst remove` fans out to a Pulumi engine that can outlive
          # it, so an unlock on the retry path could force-clear the lock still
          # held by a first attempt that is quietly still running. Two engines on
          # one state object is state corruption, not a slow teardown.
          pnpm -C infra exec sst unlock --stage "$STAGE" 2>&1 || true

          # --kill-after escalates to SIGKILL 60s after SIGTERM, so a first attempt
          # that ignores TERM cannot survive into the retry as an orphan.
          remove() {
            timeout --kill-after=60s "$1" \
              pnpm -C infra exec sst remove --stage "$STAGE" --print-logs
          }
          if remove 15m; then
            echo "::notice::Removed stage ${STAGE} on the first attempt"
            exit 0
          fi
          echo "::notice::First remove of ${STAGE} did not finish — waiting for Lambda ENIs to detach, then retrying"
          # The wait's internal budget is checked BETWEEN polls, so a throttled EC2
          # endpoint could overshoot it and push the retry past the job timeout —
          # re-creating the mid-remove cancellation that leaked the resources. Its
          # expiry is a non-failure by design, so an outer bound is safe to ignore.
          timeout --kill-after=60s 22m node scripts/await-eni-detach.mts "$STAGE" || \
            echo "::warning::ENI detach wait exceeded its outer bound — retrying the remove anyway"
          if timeout --kill-after=30s 3m node scripts/await-sst-stage-removal.mts "$STAGE"; then
            echo "::notice::Original remove completed while ${STAGE} dependencies settled"
            exit 0
          fi
          if remove 15m; then
            exit 0
          fi
          # A retry can race the original Pulumi engine's final unlock. Confirm
          # state removal instead of force-clearing a lock that may still be live.
          if timeout --kill-after=30s 3m node scripts/await-sst-stage-removal.mts "$STAGE"; then
            echo "::notice::Original remove completed after the retry returned"
            exit 0
          fi
          echo "::error::Stage ${STAGE} still has SST state or stage-owned AWS resources after cleanup attempts"
          exit 1

      - name: Comment cleanup status
        if: success() && steps.check-state.outputs.deployed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [`## 🧹 Preview Cleanup`, '', `Stage \`pr-${pr}\` has been removed.`].join('\n'),
            });

  # ───────────────────────────────────────────────────────────────────────────
  # build-and-push-image — build the four arm64 workload images and push them to
  # the out-of-band ECR repositories. Release builds (`push` and
  # `workflow_dispatch`) get `mem9-<sha7>` + `latest`; pull requests get only
  # `pr-<sha7>`. Runs on all three events so previews exercise the real images
  # and prod pins the exact commit. Exposes the per-commit tag as an output that
  # deploy-preview and deploy-prod consume. Hard-fails on release events without
  # the scope-specific role; on PR it skips gracefully when the preview role is
  # absent, while production hard-fails without its role.
  # ───────────────────────────────────────────────────────────────────────────
  verify-production-image-transition:
    name: Verify production image source
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: prod
    needs: [ changes, application-region, typecheck ]
    if: >-
      !inputs.runtime_cutover && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.workload_changed == 'true' || needs.changes.outputs.aws_mutation_required == 'true')
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      MEM9_CI_ACQUISITION_CONFIG: ${{ secrets.MEM9_CI_PROD_ACQUISITION_CONFIG }}
    outputs:
      image_transition: ${{ steps.source.outputs.image_transition }}
    steps:
      - name: Deployment maintenance gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
          HAS_AWS: ${{ secrets.AWS_PROD_ROLE_ARN }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::error::Guarded workload-boundary migration is incomplete — refusing prod deployment"
            exit 1
          fi
          if [ -z "$HAS_AWS" ]; then
            echo "::error::Production image verification requires the active isolated deployment role"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install production image verifier dependencies
        run: npm ci
      - id: ci_smoke_source
        name: Verify actual CI smoke source evidence (hard)
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
        uses: ./.github/actions/ci-smoke-gate
        with:
          mode: source
        continue-on-error: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify protected image upgrade source
        id: source
        env:
          STAGE: prod
          MEM9_DEPLOY_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_DECISION_ARTIFACT_BUCKET: ${{ vars.MEM9_DECISION_ARTIFACT_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-image-security-deployment.mjs

      - name: Remove private image transition bundle
        if: always() && env.MEM9_IMAGE_TRANSITION_BUNDLE_FILE != ''
        run: node scripts/verify-image-security-deployment.mjs --cleanup
      - name: Remove owned CI smoke source evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-source

  build-and-push-image:
    name: Build & push workload images
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: ${{ github.event_name == 'pull_request' && 'preview-ci' || 'prod' }}
    needs: [ changes, application-region, typecheck, verify-production-image-transition ]
    if: >-
      always() && !inputs.runtime_cutover && needs.changes.outputs.aws_mutation_required == 'true' && needs.application-region.result == 'success' && needs.typecheck.result == 'success' && (github.event_name == 'pull_request' || (needs.verify-production-image-transition.result == 'success' && needs.verify-production-image-transition.outputs.image_transition == 'false')) && (
        github.event_name == 'push'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main')
      )
    # arm64 build: native on the self-hosted arm64 pool, QEMU-emulated on
    # ubuntu-latest (slower). Give the go build + emulation headroom.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      ROLE_NAME: ${{ github.event_name == 'pull_request' && 'github-actions-mem9-on-aws-preview' || 'github-actions-mem9-on-aws-prod' }}
      ECR_NS: ${{ github.event_name == 'pull_request' && 'mem9-on-aws/preview' || 'mem9-on-aws' }}
    outputs:
      # The per-commit tag, or empty when skipped, so
      # downstream jobs can fall back to `latest`.
      image_tag: ${{ steps.tag.outputs.image_tag }}
      bootstrap_digest: ${{ steps.bootstrap.outputs.digest }}
      fixture_runner_digest: ${{ steps.canary-runner.outputs.digest }}
      fixture_database_digest: ${{ steps.canary-database.outputs.digest }}
      mnemo_digest: ${{ steps.mnemo.outputs.digest }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on scope-specific AWS role
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ github.event_name == 'pull_request' && secrets.AWS_PREVIEW_ROLE_ARN || secrets.AWS_PROD_ROLE_ARN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::Guarded workload-boundary migration is incomplete — refusing AWS image publication"
              exit 1
            fi
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview image builds"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::AWS_PROD_ROLE_ARN not configured — cannot build/push workload images for prod."
              exit 1
            fi
            echo "::notice::AWS_PREVIEW_ROLE_ARN not configured — skipping preview image builds"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Resolve image tag
        id: tag
        if: steps.gate.outputs.skip != 'true'
        # Distinct prefixes so PR-preview churn and release images don't share a
        # lifecycle-expiry window (ecr-repositories.yaml): `pr-<sha7>` for PR
        # builds (expired aggressively), `mem9-<sha7>` for release builds on main
        # (retained long). A prod task pins the release tag by name, so it must
        # never be aged out by preview traffic. GITHUB_SHA is trusted (GitHub-
        # controlled), so it's safe in run:; on a PR it's the ephemeral merge SHA.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/image-tags.mjs

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_PREVIEW_ROLE_ARN || secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve per-image tag lists
        id: tags
        if: steps.gate.outputs.skip != 'true'
        # Expand the tested event-to-tag output for each image. This keeps the
        # release/preview decision in one pure function.
        run: |
          emit() { # $1 = image name (repo leaf), $2 = output key
            {
              echo "$2<<EOF"
              while IFS= read -r tag; do
                [ -n "$tag" ] && echo "${REGISTRY}/${ECR_NS}/$1:${tag}"
              done <<< "$IMAGE_TAGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          emit mnemo-server mnemo_tags
          emit qwen3-embed  embed_tags
          emit bootstrap    bootstrap_tags
          emit llm-proxy    llm_proxy_tags
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAGS: ${{ steps.tag.outputs.image_tags }}

      - name: Set up QEMU
        # Enables linux/arm64 emulation on x86 runners (ubuntu-latest). A no-op
        # cost on the native-arm64 self-hosted pool.
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build & push mnemo-server (arm64)
        id: mnemo
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/mnemo-server/Dockerfile
          pull: true
          no-cache-filters: builder,runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.mnemo_tags }}
          cache-from: type=gha,scope=mnemo-server
          cache-to: type=gha,mode=max,scope=mnemo-server

      - name: Smoke test mnemo-server EMF framing (non-TTY)
        if: false
        env:
          MNEMO_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/mnemo-server:${{ steps.tag.outputs.image_tag }}
        run: bash scripts/run-mnemo-emf-smoke.sh

      - name: Build & push qwen3-embed (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/qwen3-embed/Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.embed_tags }}
          # Distinct cache scope so the heavy model-bake layer caches separately.
          cache-from: type=gha,scope=qwen3-embed
          cache-to: type=gha,mode=max,scope=qwen3-embed

      - name: Build & push bootstrap (arm64)
        id: bootstrap
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/bootstrap/Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.bootstrap_tags }}
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,mode=max,scope=bootstrap

      - name: Build & push canary fixture database (arm64)
        id: canary-database
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/canary-fixture/database.Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/bootstrap:${{ steps.tag.outputs.image_tag }}-canary-db
          cache-from: type=gha,scope=canary-fixture-database
          cache-to: type=gha,mode=max,scope=canary-fixture-database

      - name: Build & push canary fixture runner (arm64)
        id: canary-runner
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/canary-fixture/runner.Dockerfile
          pull: true
          no-cache-filters: runtime
          build-args: BOOTSTRAP_IMAGE=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/bootstrap@${{ steps.bootstrap.outputs.digest }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/bootstrap:${{ steps.tag.outputs.image_tag }}-canary-runner
          cache-from: type=gha,scope=canary-fixture-runner
          cache-to: type=gha,mode=max,scope=canary-fixture-runner

      - name: Build & push llm-proxy (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/llm-proxy/Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.llm_proxy_tags }}
          cache-from: type=gha,scope=llm-proxy
          cache-to: type=gha,mode=max,scope=llm-proxy

  build-image-transition-control:
    name: Build image transition control
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: prod
    needs: [ application-region, verify-production-image-transition ]
    if: >-
      needs.verify-production-image-transition.result == 'success' && needs.verify-production-image-transition.outputs.image_transition == 'true'
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      MEM9_CI_ACQUISITION_CONFIG: ${{ secrets.MEM9_CI_PROD_ACQUISITION_CONFIG }}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      bootstrap_digest: ${{ steps.bootstrap.outputs.digest }}
      control_capture: ${{ steps.publish_control_capture.outputs.commitment }}
    steps:
      - name: Deployment maintenance gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
          HAS_AWS: ${{ secrets.AWS_PROD_ROLE_ARN }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::error::Guarded workload-boundary migration is incomplete — refusing prod deployment"
            exit 1
          fi
          if [ -z "$HAS_AWS" ]; then
            echo "::error::Production image verification requires the active isolated deployment role"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install production image verifier dependencies
        run: npm ci
      - id: ci_smoke_source
        name: Verify actual CI smoke source evidence (hard)
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
        uses: ./.github/actions/ci-smoke-gate
        with:
          mode: source
        continue-on-error: false

      - name: Configure AWS credentials (OIDC)
        id: control_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: true

      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/image-tags.mjs

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Verify protected image upgrade source
        id: source
        env:
          STAGE: prod
          MEM9_DEPLOY_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_DECISION_ARTIFACT_BUCKET: ${{ vars.MEM9_DECISION_ARTIFACT_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-image-security-deployment.mjs --build

      - name: Verify CONTROL build context
        env:
          STAGE: prod
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-nonroot-control-build.mjs prepare

      - name: Build & push image transition bootstrap (arm64)
        id: bootstrap
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/bootstrap/Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mem9-on-aws/bootstrap:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,mode=max,scope=bootstrap

      - name: Record actual CONTROL build action
        env:
          STAGE: prod
          GH_TOKEN: ${{ github.token }}
          MEM9_CONTROL_BUILD_METADATA: ${{ steps.bootstrap.outputs.metadata }}
          MEM9_EXPECTED_BOOTSTRAP_DIGEST: ${{ steps.bootstrap.outputs.digest }}
        run: node scripts/record-nonroot-control-build.mjs capture

      - name: Preserve private CONTROL build capture
        id: publish_control_capture
        env:
          STAGE: prod
          GH_TOKEN: ${{ github.token }}
          MEM9_DEPLOY_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_DECISION_ARTIFACT_BUCKET: ${{ vars.MEM9_DECISION_ARTIFACT_BUCKET }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_CREDENTIALS_EXPIRES: ${{ steps.control_credentials.outputs.aws-expiration }}
        run: node scripts/record-nonroot-control-build.mjs publish

      - name: Remove owned CONTROL build capture
        if: always()
        run: node scripts/record-nonroot-control-build.mjs cleanup

      - name: Remove private image transition bundle
        if: always() && env.MEM9_IMAGE_TRANSITION_BUNDLE_FILE != ''
        run: node scripts/verify-image-security-deployment.mjs --cleanup
      - name: Remove owned CI smoke source evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-source

  build-human-acceptance-image:
    name: Build human namespace acceptance image
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    needs: [ changes, application-region, typecheck ]
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main' && needs.changes.outputs.aws_mutation_required == 'true' && needs.application-region.result == 'success' && needs.typecheck.result == 'success'
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      ECR_NS: mem9-on-aws/preview
    outputs:
      image_tag: ${{ steps.tag.outputs.human_image_tag }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi
      - name: Gate on AWS_PREVIEW_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Workload boundary unavailable — skipping human acceptance image"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::Preview AWS role unavailable — skipping human acceptance image"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
      - name: Resolve human image tag
        id: tag
        if: steps.gate.outputs.skip != 'true'
        env:
          EVENT_NAME: pull_request
        run: node scripts/image-tags.mjs
      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: steps.gate.outputs.skip != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.gate.outputs.skip != 'true'
      - name: Build & push human acceptance (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/human-acceptance/Dockerfile
          pull: true
          no-cache-filters: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/bootstrap:${{ steps.tag.outputs.human_image_tag }}
          cache-from: type=gha,scope=human-acceptance
          cache-to: type=gha,mode=max,scope=human-acceptance

  # ───────────────────────────────────────────────────────────────────────────
  # deploy-prod — push to main → stage `prod`. Every credential-bearing
  # production job is directly gated by the protected `prod` Environment.
  # Ordinary workload and application-IaC changes use this run's validated
  # image build. Protected security transitions retain their separate control
  # build and authenticated data-image selection.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy prod
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: prod
    needs:
      - changes
      - application-region
      - typecheck
      - build-and-push-image
      - verify-production-image-transition
      - build-image-transition-control
      - mnemo-nonroot-smoke
    if: >-
      (always() && !inputs.runtime_cutover && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.aws_mutation_required == 'true' && needs.application-region.result == 'success' && needs.typecheck.result == 'success' && needs.verify-production-image-transition.result == 'success' && (
        (needs.verify-production-image-transition.outputs.image_transition == 'true' && needs.build-image-transition-control.result == 'success' && needs.build-and-push-image.result == 'skipped')
        || (needs.verify-production-image-transition.outputs.image_transition == 'false' && needs.build-image-transition-control.result == 'skipped' && needs.build-and-push-image.result == 'success')
      )) && (needs.verify-production-image-transition.outputs.image_transition == 'true' || needs.mnemo-nonroot-smoke.result == 'success')
    # Full-stack prod: Aurora + the 3-container ECS task (qwen3 image pull + 180s
    # health startPeriod) + the bootstrap run-task. No RDS Proxy (dropped — see
    # infra/db.ts). The configured custom reconciliation budget
    # can wait just under 30m, and bootstrap/E2E follow it. The failure reporter
    # is a separate always() job, so it still runs if this 75m budget is exhausted.
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    env:
      MEM9_CI_ACQUISITION_CONFIG: ${{ secrets.MEM9_CI_PROD_ACQUISITION_CONFIG }}
      MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      ROLE_NAME: github-actions-mem9-on-aws-prod
      MEM9_EXPECT_IMAGE_TRANSITION: ${{ needs.verify-production-image-transition.outputs.image_transition }}
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
      # Authentication is an operator choice. Preview jobs receive none of these
      # settings and continue to create isolated Cognito pools and test clients.
      MEM9_AUTH_MODE: ${{ secrets.MEM9_AUTH_MODE || 'managed' }}
      MEM9_OIDC_ISSUER: ${{ secrets.MEM9_OIDC_ISSUER }}
      MEM9_OIDC_CLIENT_ID: ${{ secrets.MEM9_OIDC_CLIENT_ID }}
      SST_SECRET_OidcClientSecret: ${{ secrets.MEM9_OIDC_CLIENT_SECRET }}
      MEM9_OIDC_TOKEN_AUTH_METHOD: ${{ secrets.MEM9_OIDC_TOKEN_AUTH_METHOD }}
      MEM9_OIDC_M2M_CLIENT_ID: ${{ secrets.MEM9_OIDC_M2M_CLIENT_ID }}
      SST_SECRET_OidcM2mClientSecret: ${{ secrets.MEM9_OIDC_M2M_CLIENT_SECRET }}
      MEM9_OIDC_AUDIENCE: ${{ secrets.MEM9_OIDC_AUDIENCE }}
      MEM9_OIDC_CLIENT_ID_CLAIM: ${{ secrets.MEM9_OIDC_CLIENT_ID_CLAIM }}
      MEM9_AUTH_REQUIRED_GROUP: ${{ secrets.MEM9_AUTH_REQUIRED_GROUP }}
      MEM9_AUTH_GROUP_CLAIM: ${{ secrets.MEM9_AUTH_GROUP_CLAIM }}
      MEM9_RETAIN_MANAGED_AUTH: ${{ secrets.MEM9_RETAIN_MANAGED_AUTH }}
    steps:
      - name: Deployment maintenance gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::error::Guarded workload-boundary migration is incomplete — refusing prod deployment"
            exit 1
          fi

      - name: Gate on AWS_PROD_ROLE_ARN (hard-fail)
        env:
          HAS_AWS: ${{ secrets.AWS_PROD_ROLE_ARN }}
        run: |
          if [ -z "$HAS_AWS" ]; then
            echo "::error::AWS_PROD_ROLE_ARN not configured — cannot deploy prod."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Retained data authorization compares the historical and control
          # release recipes before deploying the independently built operator.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Resolve Cloudflare account ID
        shell: bash
        env:
          MEM9_FACADE_CUSTOM_DOMAIN: ${{ secrets.MEM9_FACADE_CUSTOM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/resolve-cloudflare-account.mjs

      - name: Install infra dependencies
