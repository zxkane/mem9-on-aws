  report-prod-failure:
    name: Report prod deploy failure
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    needs: [ changes, deploy-prod ]
    if: >-
      always() && !inputs.carrier_before_copy && !inputs.runtime_cutover && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (
        needs.changes.result != 'success'
        || (
          needs.changes.outputs.aws_mutation_required == 'true'
          && needs.deploy-prod.result != 'success'
        )
      )
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue on prod deploy failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_EVENT: ${{ github.event_name }}
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const subject = (process.env.COMMIT_MSG || '').split('\n')[0].trim() || '(no commit subject)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Prod deploy failed: ${subject}`,
              body: [
                `## Prod deploy failed`,
                '',
                `| Item | Value |`,
                `|------|-------|`,
                `| Commit | [\`${shortSha}\`](${commitUrl}) |`,
                `| Subject | ${subject} |`,
                `| Trigger | \`${process.env.DEPLOY_EVENT}\` |`,
                `| Run | [View logs](${runUrl}) |`,
                '',
                '### Recovery',
                '',
                `1. Inspect the [failed run](${runUrl}).`,
                `2. Fix on a follow-up PR and merge — every push to \`main\` re-triggers the deploy.`,
                `3. Manual re-trigger without a new commit: re-run the failed job from the run page.`,
              ].join('\n'),
              labels: ['bug', 'infrastructure'],
            });

  runtime-cutover-prod:
    name: Production runtime credential cutover
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: prod
    needs:
      - application-region
      - typecheck
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_cutover && inputs.runtime_stage == 'prod'
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    env:
      MEM9_CI_ACQUISITION_CONFIG: ${{ secrets.MEM9_CI_PROD_ACQUISITION_CONFIG }}
      MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      ROLE_NAME: github-actions-mem9-on-aws-prod
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
      MEM9_AUTH_MODE: ${{ secrets.MEM9_AUTH_MODE || 'managed' }}
      MEM9_OIDC_ISSUER: ${{ secrets.MEM9_OIDC_ISSUER }}
      MEM9_OIDC_CLIENT_ID: ${{ secrets.MEM9_OIDC_CLIENT_ID }}
      SST_SECRET_OidcClientSecret: ${{ secrets.MEM9_OIDC_CLIENT_SECRET }}
      MEM9_OIDC_TOKEN_AUTH_METHOD: ${{ secrets.MEM9_OIDC_TOKEN_AUTH_METHOD }}
      MEM9_OIDC_M2M_CLIENT_ID: ${{ secrets.MEM9_OIDC_M2M_CLIENT_ID }}
      SST_SECRET_OidcM2mClientSecret: ${{ secrets.MEM9_OIDC_M2M_CLIENT_SECRET }}
      MEM9_OIDC_AUDIENCE: ${{ secrets.MEM9_OIDC_AUDIENCE }}
      MEM9_OIDC_CLIENT_ID_CLAIM: ${{ secrets.MEM9_OIDC_CLIENT_ID_CLAIM }}
      MEM9_AUTH_REQUIRED_GROUP: ${{ secrets.MEM9_AUTH_REQUIRED_GROUP }}
      MEM9_AUTH_GROUP_CLAIM: ${{ secrets.MEM9_AUTH_GROUP_CLAIM }}
      MEM9_RETAIN_MANAGED_AUTH: ${{ secrets.MEM9_RETAIN_MANAGED_AUTH }}
      MEM9_CONSOLIDATION_SCHEDULE_ENABLED: ${{ vars.MEM9_NAMESPACE_CONSOLIDATION_SCHEDULE_ENABLED || '0' }}
      MEM9_COGNITO_DOMAIN_PREFIX: ${{ vars.MEM9_COGNITO_DOMAIN_PREFIX }}
      MEM9_BEDROCK_PROJECT: ${{ vars.MEM9_BEDROCK_PROJECT }}
      MEM9_BEDROCK_PROJECT_OPENAI: ${{ vars.MEM9_BEDROCK_PROJECT_OPENAI }}
      MEM9_LLM_MODEL: ${{ vars.MEM9_LLM_MODEL }}
      WORKLOAD_BOUNDARY_PROD_ENABLED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
      MEM9_DURABLE_INGEST_ENABLED: "1"
      MEM9_NAMESPACE_REQUIRED: "1"
      MEM9_FACADE_CUSTOM_DOMAIN: ${{ secrets.MEM9_FACADE_CUSTOM_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SST_SECRET_SlackWebhookUrl: ${{ secrets.SLACK_WEBHOOK_URL }}
      MEM9_RUNTIME_READY: "1"
      STAGE: ${{ inputs.runtime_stage }}
    steps:
      - name: Validate maintenance target
        shell: bash
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
          BOUNDARY: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          CANCELLATION_MODE: ${{ inputs.runtime_cancellation_mode }}
        run: |-
          set -euo pipefail
          if [[ "$CANCELLATION_MODE" != normal ]]; then echo 'Cancellation drill is preview-only'; exit 1; fi
          if [[ "$PAUSED" == true || "$BOUNDARY" != true ]]; then echo 'Runtime maintenance gate is closed'; exit 1; fi
          if [[ "$STAGE" == prod ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Production cutover requires main'; exit 1; }
          else
            [[ "$STAGE" =~ ^pr-[1-9][0-9]*$ ]] || { echo 'Invalid preview stage'; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Resolve Cloudflare account ID
        run: node scripts/resolve-cloudflare-account.mjs
      - name: Install operator dependencies
        run: |-
          npm ci
          pnpm -C infra install --frozen-lockfile
      - id: ci_smoke_source
        name: Verify actual CI smoke source evidence (hard)
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
        uses: ./.github/actions/ci-smoke-gate
        with:
          mode: source
        continue-on-error: false
      - id: ci_smoke_guard_d9615ea5ee84
        name: "Verify smoke phase receipt: Run guarded runtime cutover"
        shell: bash
        if: success() && (true)
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-prod
          MEM9_CI_SMOKE_STEP: runtime-cutover-prod/7
          MEM9_CI_SMOKE_PHASE: source
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Run guarded runtime cutover
        uses: ./.github/actions/runtime-cutover
        with:
          role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
          cleanup-preview: "false"
          ci-smoke-route: runtime-cutover-prod
          ci-smoke-call-path: runtime-cutover-prod/7
        if: success() && steps.ci_smoke_guard_d9615ea5ee84.outcome == 'success' && (true)
        continue-on-error: false
      - name: Restore interrupted production runtime
        if: failure() || cancelled()
        uses: ./.github/actions/runtime-recovery
        with:
          role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
      - name: Remove owned CI smoke source evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-source
  runtime-cutover-preview:
    name: Preview runtime credential rehearsal (${{ inputs.runtime_stage }})
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    needs:
      - application-region
      - typecheck
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_cutover && inputs.runtime_stage != 'prod'
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    env:
      MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
      MEM9_NAMESPACE_REQUIRED: "1"
      MEM9_RUNTIME_READY: "1"
      MEM9_DURABLE_INGEST_ENABLED: "1"
      WORKLOAD_BOUNDARY_PROD_ENABLED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
      # Match normal preview CI; the production weekly-task opt-in is not a
      # preview target configuration. Continuous preview workers are separate.
      MEM9_CONSOLIDATION_SCHEDULE_ENABLED: "0"
      MEM9_BEDROCK_PROJECT: ${{ vars.MEM9_BEDROCK_PROJECT }}
      MEM9_BEDROCK_PROJECT_OPENAI: ${{ vars.MEM9_BEDROCK_PROJECT_OPENAI }}
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
      MEM9_LLM_MODEL: ${{ vars.MEM9_LLM_MODEL }}
      STAGE: ${{ inputs.runtime_stage }}
      AWS_REGION: ${{ needs.application-region.outputs.region }}
    steps:
      - name: Deployment maintenance gate
        shell: bash
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
          BOUNDARY: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          CANCELLATION_MODE: ${{ inputs.runtime_cancellation_mode }}
        run: |-
          set -euo pipefail
          case "$CANCELLATION_MODE" in normal|cancel|resume) ;; *) exit 1 ;; esac
          if [ "$PAUSED" = "true" ]; then
            echo '::error::AWS deployments are paused for guarded IAM maintenance'
            exit 1
          fi
          if [[ "$BOUNDARY" != true ]]; then echo 'Runtime maintenance gate is closed'; exit 1; fi
          if [[ "$STAGE" == prod ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Production cutover requires main'; exit 1; }
          else
            [[ "$STAGE" =~ ^pr-[1-9][0-9]*$ ]] || { echo 'Invalid preview stage'; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install operator dependencies
        run: |-
          npm ci
          pnpm -C infra install --frozen-lockfile
      - id: ci_smoke_source
        name: Verify actual CI smoke source evidence (hard)
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
        uses: ./.github/actions/ci-smoke-gate
        with:
          mode: source
        continue-on-error: false
      - id: ci_smoke_guard_921d03b91e6e
        name: "Verify smoke phase receipt: Prepare guarded runtime cutover"
        shell: bash
        if: success() && (inputs.runtime_cancellation_mode != 'resume')
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-preview
          MEM9_CI_SMOKE_STEP: runtime-cutover-preview/6
          MEM9_CI_SMOKE_PHASE: source
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Prepare guarded runtime cutover
        if: success() && steps.ci_smoke_guard_921d03b91e6e.outcome == 'success' && (inputs.runtime_cancellation_mode != 'resume')
        uses: ./.github/actions/runtime-cutover
        with:
          role-arn: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
          phase: prepare
          ci-smoke-route: runtime-cutover-preview
          ci-smoke-call-path: runtime-cutover-preview/6
        continue-on-error: false
      - id: ci_smoke_guard_a94fb5280ae4
        name: "Verify smoke phase receipt: Arm preview cancellation rehearsal"
        shell: bash
        if: success() && (inputs.runtime_cancellation_mode == 'cancel')
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-preview
          MEM9_CI_SMOKE_STEP: runtime-cutover-preview/7
          MEM9_CI_SMOKE_PHASE: preupdate
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Arm preview cancellation rehearsal
        id: cancel_arm
        if: success() && steps.ci_smoke_guard_a94fb5280ae4.outcome == 'success' && (inputs.runtime_cancellation_mode == 'cancel')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-production-runtime.mjs arm-cancellation
        continue-on-error: false
      - name: Refresh preview resume credentials
        if: inputs.runtime_cancellation_mode == 'resume'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ needs.application-region.outputs.region }}
          mask-aws-account-id: true
      - id: ci_smoke_guard_2965a7ceae9b
        name: "Verify smoke phase receipt: Resume verified cancellation rehearsal"
        shell: bash
        if: success() && (inputs.runtime_cancellation_mode == 'resume')
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-preview
          MEM9_CI_SMOKE_STEP: runtime-cutover-preview/9
          MEM9_CI_SMOKE_PHASE: preupdate
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Resume verified cancellation rehearsal
        if: success() && steps.ci_smoke_guard_2965a7ceae9b.outcome == 'success' && (inputs.runtime_cancellation_mode == 'resume')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-production-runtime.mjs resume
        continue-on-error: false
      - id: ci_smoke_guard_a28ca7f1c60f
        name: "Verify smoke phase receipt: Finish guarded runtime cutover"
        shell: bash
        if: success() && (true)
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-preview
          MEM9_CI_SMOKE_STEP: runtime-cutover-preview/10
          MEM9_CI_SMOKE_PHASE: preupdate
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Finish guarded runtime cutover
        uses: ./.github/actions/runtime-cutover
        env:
          MEM9_RUNTIME_CANCELLATION_DRILL: ${{ inputs.runtime_cancellation_mode == 'cancel' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        with:
          role-arn: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
          phase: finish
          cleanup-preview: "true"
          ci-smoke-route: runtime-cutover-preview
          ci-smoke-call-path: runtime-cutover-preview/10
        if: success() && steps.ci_smoke_guard_a28ca7f1c60f.outcome == 'success' && (true)
        continue-on-error: false
      - id: ci_smoke_guard_7d373d02392f
        name: "Verify smoke phase receipt: Retained data and current control acceptance (preview, hard)"
        shell: bash
        if: success() && (success() && inputs.runtime_retained_data_run != '')
        env:
          MEM9_CI_SMOKE_ROUTE: runtime-cutover-preview
          MEM9_CI_SMOKE_STEP: runtime-cutover-preview/11
          MEM9_CI_SMOKE_PHASE: prereadiness
        run: node scripts/verify-ci-smoke-isolation.mjs guard --route "$MEM9_CI_SMOKE_ROUTE" --step "$MEM9_CI_SMOKE_STEP" --phase "$MEM9_CI_SMOKE_PHASE"
        continue-on-error: false
      - name: Retained data and current control acceptance (preview, hard)
        if: success() && steps.ci_smoke_guard_7d373d02392f.outcome == 'success' && (success() && inputs.runtime_retained_data_run != '')
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_RETAINED_PREVIEW_DATA_RUN_ID: ${{ inputs.runtime_retained_data_run }}
        run: node scripts/run-retained-data-preview.mjs
        continue-on-error: false
      - name: Restore interrupted preview runtime
        if: (failure() || cancelled()) && !(cancelled() && steps.cancel_arm.outputs.armed == 'true')
        uses: ./.github/actions/runtime-recovery
        with:
          role-arn: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
      - name: Remove disposable rehearsal
        if: always() && !(cancelled() && steps.cancel_arm.outputs.armed == 'true') && (inputs.runtime_cancellation_mode != 'resume' || success())
        uses: ./.github/actions/runtime-cleanup
        with:
          role-arn: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          region: ${{ needs.application-region.outputs.region }}
      - name: Remove owned CI smoke source evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-source
  mnemo-nonroot-smoke:
    name: Mnemo nonroot smoke
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: ${{ github.event_name == 'pull_request' && 'preview-ci' || 'prod' }}
    needs:
      - application-region
      - build-and-push-image
    if: >-
      !cancelled() && needs.application-region.result == 'success' && needs.build-and-push-image.result == 'success' && needs.build-and-push-image.outputs.mnemo_digest != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
      MEM9_DEPLOY_ROLE_ARN: ${{ github.event_name == 'pull_request' && secrets.AWS_PREVIEW_ROLE_ARN || secrets.AWS_PROD_ROLE_ARN }}
      MNEMO_DIGEST: ${{ needs.build-and-push-image.outputs.mnemo_digest }}
      MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
      MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
    outputs:
      commitment: ${{ steps.publish.outputs.commitment }}
    steps:
      - name: Deployment maintenance gate
        shell: bash
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
          BOUNDARY: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
        run: test "$PAUSED" != true && test "$BOUNDARY" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install smoke verification dependencies
        run: npm ci
      - name: Prepare isolated smoke Docker
        run: node scripts/verify-smoke-docker.mjs prepare
      - name: Set up isolated smoke Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.0
          context: setup-docker-action
          set-host: true
          runtime-basedir: ${{ runner.temp }}/mem9-smoke-docker
          daemon-config: '{"debug":false,"log-level":"info","features":{"containerd-snapshotter":true}}'
      - name: Verify isolated smoke Docker
        run: node scripts/verify-smoke-docker.mjs verify
      - name: Authenticate smoke build and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci-smoke-isolation.mjs prepare-smoke
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - name: Configure smoke registry credentials
        id: smoke_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_PREVIEW_ROLE_ARN || secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          output-credentials: true
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Acquire exact smoke image digests
        run: node scripts/verify-ci-smoke-isolation.mjs acquire-smoke
      - name: Run isolated fourteen-check smoke
        run: bash scripts/run-mnemo-nonroot-smoke.sh --input "$RUNNER_TEMP/mem9-ci-smoke-input.json" --output-dir "$RUNNER_TEMP/mem9-ci-smoke-evidence"
      - name: Verify and preserve private smoke evidence
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_CREDENTIALS_EXPIRES: ${{ steps.smoke_credentials.outputs.aws-expiration }}
        run: node scripts/verify-ci-smoke-isolation.mjs publish-smoke
      - name: Remove owned smoke evidence
        if: always()
        run: node scripts/verify-ci-smoke-isolation.mjs cleanup-smoke
