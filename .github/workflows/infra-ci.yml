# Infra CI/CD for the mem9-on-aws SST v4 runtime.
#
# Flow:
#   1. typecheck        — typecheck + unit tests (PR + push-to-main; always runs)
#   2. deploy-preview   — PR opened/synchronized/reopened → deploy stage `pr-N`
#   3. cleanup-preview  — PR closed/merged → remove stage `pr-N`
#   4. deploy-prod      — push to main → deploy stage `prod`
#
# Required GitHub repo secret:
#   AWS_ROLE_ARN — IAM role ARN from
#                  `infra/cloudformation/github-actions-role.yaml` (bootstrapped
#                  out-of-band via `scripts/deploy-github-role.sh`).
#                  deploy-prod HARD-FAILS without it (a silent skip would let a
#                  push to main "succeed" without deploying). Preview/cleanup
#                  skip gracefully when it's unset.
#
# Optional GitHub repo secret:
#   MEM9_FACADE_CUSTOM_DOMAIN — production OAuth façade hostname, for example
#                  memory.example.com. Unset keeps the execute-api URL.
#   CLOUDFLARE_API_TOKEN — required when the custom hostname is set. Scope it to
#                  Zone:Read + DNS:Edit for that one Cloudflare zone.
#   CLOUDFLARE_ZONE_ID — required when the custom hostname is set. The existing
#                  Cloudflare zone that contains the hostname.
#
# Optional GitHub repo variables:
#   RUNNER_LABEL — JSON array selecting a self-hosted runner, e.g.
#                  ["self-hosted", "linux", "arm64"]. Unset → ubuntu-latest.
#   DEPLOYMENT_MAINTENANCE_PAUSED — set to true during the guarded workload-role
#                  migration. Existing AWS jobs fail before assuming the deploy
#                  role; the operator also waits for every prior run to finish.
#   WORKLOAD_BOUNDARY_PROD_ENABLED — explicitly false before migration and set
#                  to true only after every live role is bounded. Every AWS job
#                  stays disabled until true; prod also fails synthesis unless
#                  the value is explicitly true or false.
#   MEM9_CONSOLIDATION_SCHEDULE_ENABLED — set to 1 only after the one-shot
#                  cleanup and an actionable report-only consolidation run.
#                  Unset keeps the production weekly schedule absent.
#   MEM9_CLEANUP_SCAN_SCHEDULE_ENABLED — set to 1 only after an operator-initiated
#                  memory-cleanup.mjs dry run has posted an actionable approval
#                  list by hand. Unset keeps the weekly scan schedule, its
#                  Scheduler role, and its group absent; the apply half of the
#                  Slack loop still works from a manual offer. Separate from
#                  MEM9_SLACK_APPROVAL_ENABLED because the apply half is inert
#                  until a human clicks while the scan runs unattended and spends
#                  two reasoning-model passes a week. Requires the scan Scheduler
#                  role's iam:PassRole widening in the deploy role
#                  (github-actions-role.yaml) to be rolled out FIRST.
#   MEM9_LLM_RESPONSES_REGION — independent fallback region for selected OpenAI
#                  GPT models. Unset keeps the runtime/boundary default us-west-2.
#   MEM9_COGNITO_DOMAIN_PREFIX — existing production Cognito domain prefix.
#                  Set this before adopting derived defaults so prod keeps its
#                  current OAuth hostname. Previews intentionally do not use it.
#   MEM9_DECISION_ARTIFACT_BUCKET — exact account-level bucket bootstrapped by
#                  scripts/deploy-decision-artifact-bucket.sh. Unset uses
#                  mem9-audit-<account-id>. The boundary must use the same value.
#
# Workload-boundary maintenance gate revision: 1

name: Infra CI

on:
  # Manual prod redeploy — e.g. to re-link a newly-set SST secret into the
  # deployed Lambda env (SST secrets are build-time links, so setting one needs
  # a redeploy to take effect). `seed_oauth_hmac` optionally (re)generates the
  # OAuth façade's HMAC state-signing key before the deploy.
  workflow_dispatch:
    inputs:
      seed_oauth_hmac:
        description: "Generate + set OauthStateHmacKey before deploying (enables the OAuth browser-login flow)"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "infra/**"
      - "docker/**"
      - "sst.config.ts"
      - ".github/workflows/infra-ci.yml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      # The OIDC role + ECR repositories are bootstrapped out-of-band via
      # scripts/deploy-github-role.sh / deploy-ecr-repositories.sh — NOT part of
      # the per-PR SST deploy. Re-include templates whose regression tests run
      # in this workflow.
      - "!infra/cloudformation/**"
      - "infra/cloudformation/github-actions-role.yaml"
      - "infra/cloudformation/ecr-registry-scanning.yaml"
      - "infra/cloudformation/workload-permissions-boundary.yaml"
      - "infra/cloudformation/decision-artifact-bucket.yaml"
      - "infra/cloudformation/decision-artifact-bucket-import.yaml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "docker/**"
      - "sst.config.ts"
      - ".github/workflows/infra-ci.yml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "!infra/cloudformation/**"
      - "infra/cloudformation/github-actions-role.yaml"
      - "infra/cloudformation/ecr-registry-scanning.yaml"
      - "infra/cloudformation/workload-permissions-boundary.yaml"
      - "infra/cloudformation/decision-artifact-bucket.yaml"
      - "infra/cloudformation/decision-artifact-bucket-import.yaml"

# Per-PR concurrency for PR events (cancel superseded runs so repeated
# `synchronize` events don't race the same `pr-N` stage's unlock/deploy);
# singleton for push-to-main AND manual workflow_dispatch (both deploy prod).
# Critical: the prod group is NOT cancel-in-progress — prod must never be
# interrupted mid-deploy by a subsequent merge or dispatch. The `|| 'unknown'`
# guard protects format() during push/dispatch events where
# pull_request.number is null.
concurrency:
  group: >-
    ${{
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && 'infra-deploy-prod'
        || format('infra-ci-pr-{0}', github.event.pull_request.number || 'unknown')
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ROLE_NAME: github-actions-mem9-on-aws
  MEM9_DECISION_ARTIFACT_BUCKET: ${{ vars.MEM9_DECISION_ARTIFACT_BUCKET }}
  # The out-of-band ECR repo namespace (infra/cloudformation/ecr-repositories.yaml).
  # build-and-push-image builds four images under it: <ns>/mnemo-server,
  # <ns>/qwen3-embed, <ns>/bootstrap, <ns>/llm-proxy. Deploy stages reference
  # <acct>.dkr.ecr.<region>/<ns>/<name>:<tag>.
  ECR_NS: mem9-on-aws

jobs:
  application-region:
    name: Resolve application region
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      cleanup_region: ${{ steps.resolve.outputs.cleanup_region }}
      region: ${{ steps.resolve.outputs.region }}
      region_changed: ${{ steps.resolve.outputs.region_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          path: .application-region-base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve SST AWS provider region
        id: resolve
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          region="$(node scripts/resolve-application-region.mjs)"
          cleanup_region="$region"
          region_changed=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_region="$(
              node scripts/resolve-application-region.mjs \
                --config .application-region-base/sst.config.ts
            )"
            cleanup_region="$base_region"
            if [[ "$region" != "$base_region" ]]; then
              region_changed=true
            fi
          fi
          {
            echo "cleanup_region=$cleanup_region"
            echo "region=$region"
            echo "region_changed=$region_changed"
          } >> "$GITHUB_OUTPUT"
          if [[ "$region_changed" == "true" && "$EVENT_ACTION" != "closed" ]]; then
            echo "::error::Application region changes cannot deploy PR previews. Remove old-region previews and use the dedicated live migration process."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # typecheck — runs on every PR (except closed) + push-to-main. No AWS needed.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck & Unit Tests
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.action != 'closed'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install infra dependencies
        run: pnpm -C infra install --frozen-lockfile

      - name: Install root dependencies
        run: npm ci

      - name: Install Pulumi runtime for lifecycle tests
        uses: pulumi/actions@v7
        with:
          pulumi-version: 3.256.0

      - name: Type check (infra)
        run: pnpm -C infra typecheck

      - name: Unit tests (infra)
        run: pnpm -C infra test

      - name: Consolidation coverage (infra)
        run: pnpm -C infra test:consolidation:coverage

      - name: Type check (root)
        run: npm run typecheck

      - name: Unit tests (root)
        run: npm test

      - name: Consolidation coverage (root)
        run: npm run test:consolidation:coverage

      - name: Cleanup and recovery coverage (root)
        run: npm run test:cleanup:coverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate ECR registry scanning template
        run: |
          python -m pip install --disable-pip-version-check 'cfn-lint>=1.39,<2'
          application_region="$(node scripts/resolve-application-region.mjs)"
          cfn-lint infra/cloudformation/ecr-registry-scanning.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/github-actions-role.yaml --regions us-west-2
          cfn-lint infra/cloudformation/workload-permissions-boundary.yaml --regions us-west-2
          # Application region: this bucket is deployed there, not us-west-2.
          cfn-lint infra/cloudformation/decision-artifact-bucket.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/decision-artifact-bucket-import.yaml --regions "$application_region"

      - name: Validate workload boundary operator scripts
        run: |
          # pip, not apt: the previous `apt-get update` refreshed every package
          # index to install one tool and left the job at the mercy of mirror
          # latency (two runs hung there until the 20-minute job timeout, with all
          # tests already green). It also could not pin a version, so the same
          # commit could lint against whatever shellcheck the distro happened to
          # ship. 0.11.0.1 wraps upstream 0.11.0, matching what apt installed.
          python -m pip install --disable-pip-version-check 'shellcheck-py==0.11.0.1'
          shellcheck scripts/deploy-workload-permissions-boundary.sh
          shellcheck scripts/deploy-decision-artifact-bucket.sh
          shellcheck scripts/rollout-workload-permissions-boundary.sh
          shellcheck scripts/run-consolidation-task.sh
          shellcheck scripts/run-slack-approval-e2e.sh

      - name: PostgreSQL durable ingest integration tests
        run: bash scripts/run-ingest-queue-integration.sh

  # ───────────────────────────────────────────────────────────────────────────
  # deploy-preview — PR opened/synchronized/reopened → stage `pr-N`.
  # Skipped gracefully if AWS_ROLE_ARN is unset.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    # Depends on the image build so the preview pulls this PR's freshly-built
    # workload images.
    needs: [application-region, typecheck, build-and-push-image]
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main'
    # Full-stack fresh preview: Aurora (~13m) + the 3-container ECS task (the
    # ~1.2 GB qwen3 image pull + 180s health-check startPeriod, plus the tiny
    # llm-proxy sidecar) + the bootstrap DB-retry + run-task. No RDS Proxy
    # (dropped — see infra/db.ts), so no proxy warmup wait. Measured first
    # bring-up ~30-35m; 60m leaves room for the report-only consolidation E2E
    # deploy.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::AWS_ROLE_ARN not configured — skipping preview deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm -C infra install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Preflight — verify role is assumable
        if: steps.gate.outputs.skip != 'true'
        env:
          WORKLOAD_BOUNDARY_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::OIDC role assumed but STS is unusable — check AWS_ROLE_ARN / trust policy"
            exit 1
          fi
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "::error::Role $ROLE_NAME not found — run scripts/deploy-github-role.sh to bootstrap it"
            exit 1
          fi
          if ! WORKLOAD_BOUNDARY_SKIP_DOTENV=true \
            scripts/deploy-workload-permissions-boundary.sh --verify-only; then
            echo "::error::Workload boundary preflight failed; see the diagnostic above"
            exit 1
          fi
          echo "Preflight OK: OIDC deploy role assumed"

      - name: Remove conflicting Pulumi installation
        if: steps.gate.outputs.skip != 'true'
        run: |
          # SST bundles its own Pulumi runtime; a globally-installed Pulumi can
          # win the PATH lookup and produce a version mismatch. Persistent
          # self-hosted runners can also cache stale provider binaries whose
          # schemas lag the AWS SDK.
          sudo rm -f /usr/local/bin/pulumi* 2>/dev/null || true
          rm -rf ~/.pulumi/plugins/ 2>/dev/null || true
          rm -rf ~/.config/sst/bin/ 2>/dev/null || true
          rm -rf ~/.config/sst/plugins/ 2>/dev/null || true

      - name: Deploy PR stage
        id: deploy
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        # Deploy the workload images this PR just built. If the build was skipped (no
        # AWS_ROLE_ARN), fall back to `latest` — infra/ecs.ts's own default.
        env:
          MEM9_IMAGE_TAG: ${{ needs.build-and-push-image.outputs.image_tag || 'latest' }}
          # Bedrock Project id for the llm-proxy sidecar's OpenAI-Project cost
          # header (infra/ecs.ts BEDROCK_PROJECT). Repo variable set out-of-band by
          # scripts/deploy-bedrock-mantle-project.sh; empty → the proxy omits the
          # header (still functional, just untagged).
          MEM9_BEDROCK_PROJECT: ${{ vars.MEM9_BEDROCK_PROJECT }}
          # llm-proxy Responses route (OpenAI gpt-5.6 terra/luna): the fallback
          # region's Mantle project id + model selector. The region itself is a
          # job-level variable and defaults to us-west-2 when unset.
          MEM9_BEDROCK_PROJECT_OPENAI: ${{ vars.MEM9_BEDROCK_PROJECT_OPENAI }}
          MEM9_LLM_MODEL: ${{ vars.MEM9_LLM_MODEL }}
          # The image applies the repeatable atomic-ingest migration before the
          # server starts, so one enabled rollout is safe.
          MEM9_DURABLE_INGEST_ENABLED: "1"
          # Synthesize the Scheduler resource for infra coverage, but
          # infra/consolidation.ts keeps every preview schedule DISABLED.
          MEM9_CONSOLIDATION_SCHEDULE_ENABLED: "1"
          # Attaches the allow-all compliance authorizer to the OAuth façade
          # routes (infra/oauth-facade.ts), flipping them from AuthorizationType
          # NONE to CUSTOM so the Palisade APIGv2NotNoneAuthorizer finding clears.
          # It gates nothing: empty identity sources mean the gateway invokes it on
          # every request (so anonymous OAuth discovery keeps working) and it always
          # returns isAuthorized. Real auth stays in the façade Lambda's /mcp bearer
          # check. Read at synth time, so it must be set here — a deploy without it
          # silently strips the authorizer and reopens the finding.
          MEM9_FACADE_AUTHORIZER_ENABLED: "1"
          # Slack approval (#123). Opt-in through repo variables/secrets rather than
          # a literal "1": infra/slack-approval.ts FAILS SYNTHESIS when the flag is
          # set and either secret is unseeded, and GitHub hands an unset secret to
          # the job as an EMPTY STRING — so hardcoding the flag would break every
          # PR on a repo that has not seeded a Slack app. Unset leaves the whole
          # stack ABSENT (not present-and-idle) and the E2E step below skips.
          MEM9_SLACK_APPROVAL_ENABLED: ${{ vars.MEM9_SLACK_APPROVAL_ENABLED }}
          MEM9_SLACK_APPROVAL_CHANNEL: ${{ vars.MEM9_SLACK_APPROVAL_CHANNEL }}
          SST_SECRET_SlackBotToken: ${{ secrets.SLACK_BOT_TOKEN }}
          SST_SECRET_SlackSigningSecret: ${{ secrets.SLACK_SIGNING_SECRET }}
          # Synthesize the weekly scan's schedule, group, and Scheduler role for
          # infra coverage — infra/slack-approval.ts keeps every non-prod schedule
          # DISABLED, so a preview stage cannot start a classification run against
          # the corpus prod's operator is reviewing. Literal "1" (unlike the
          # approval flag above) because the scan block is INSIDE the approval gate:
          # a repo that has not seeded a Slack app synthesizes nothing either way.
          MEM9_CLEANUP_SCAN_SCHEDULE_ENABLED: "1"
        run: |
          # PR_NUMBER comes from GitHub's pull_request payload (integer);
          # validate to short-circuit any injection risk.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          STAGE="pr-${PR_NUMBER}"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying to stage: $STAGE"

          # Clear any stale SST state lock left by a cancelled previous run.
          pnpm -C infra exec sst unlock --stage "$STAGE" 2>&1 || true

          set +e
          pnpm -C infra exec sst deploy --stage "$STAGE" --print-logs 2>&1 | tee sst-deploy.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::SST deployment failed (exit $EXIT)"
            exit "$EXIT"
          fi

      - name: Reconcile preview ECS deployment
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: node scripts/reconcile-ecs-deployment.mjs --stage "$STAGE"

      - name: Run schema-bootstrap task (preview)
        # Same one-shot bootstrap as prod (§8), idempotent. Runs against this PR's
        # pr-N stage so the preview actually has the memories schema + a tenant —
        # otherwise mnemo-server would boot but list/search would fail. STAGE comes
        # from the deploy step's output (validated pr-N).
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        shell: bash
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: bash scripts/run-bootstrap-task.sh

      - name: Run report-only consolidation task (preview)
        # Runs the exact deployed image/task/network path, requires exit 0, and
        # prints only the content-free REVIEW_LIST summary from its exact stream.
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        shell: bash
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: bash scripts/run-consolidation-task.sh

      - name: MCP write-search E2E (preview, soft)
        # The first live write->search round-trip (section 6/6a): Cognito M2M JWT
        # -> AgentCore Gateway -> VPC-attached proxy Lambda -> Cloud Map private
        # DNS -> mnemo-server -> Aurora -> qwen3 -> search. SOFT on preview
        # (E2E_SOFT=1): mem9 ingest is async, and a fresh task registration or
        # Lambda cold start can delay the first call, so a search-timeout logs a
        # ::warning:: instead of failing the PR. Prod runs the same check HARD.
        # STAGE comes from the deploy step's validated pr-N output (env, not
        # inlined into run:).
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        shell: bash
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
          E2E_SOFT: "1"
        run: bash scripts/run-mcp-e2e.sh

      - name: OAuth façade smoke (preview)
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: bash scripts/run-oauth-facade-smoke.sh

      - name: Slack approval E2E (preview)
        # TC-SLACKAPP-090. A signed synthetic interaction through the deployed
        # façade: the handler distinguishes Slack from anyone else ONLY by the
        # signature, so this exercises the identical path a real click takes,
        # plus everything the unit tests inject (API Gateway routing, the
        # Lambda's own SSM/ECS grants, the task definition, the entrypoint).
        # Self-skipping when the stage seeded no Slack secret, because approval
        # is gated on MEM9_SLACK_APPROVAL_ENABLED at synth time — a hard failure
        # there would block every PR on a feature the stage does not deploy.
        #
        # PREVIEW ONLY, and deliberately not mirrored into deploy-prod. The harness
        # OVERWRITES `approvals/offered` to seed its synthetic id, so on prod it
        # would destroy a pending human approval — the operator's next click would
        # be answered against CI's record — and it approves a DELETION against the
        # live database. The per-PR stage is disposable and holds only bootstrap
        # data, which is what makes the same script safe there.
        if: steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        shell: bash
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        run: bash scripts/run-slack-approval-e2e.sh

      - name: Auto-cleanup on deploy failure
        # Best-effort — if the deploy half-applied resources, remove them so the
        # next push doesn't accumulate orphan state.
        if: failure() && steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
        shell: bash
        continue-on-error: true
        run: |
          if ! [[ "$STAGE" =~ ^pr- ]]; then
            echo "::notice::Auto-cleanup only for pr-* stages; STAGE is protected"
            exit 0
          fi
          echo "Deploy failed for $STAGE — attempting auto-cleanup"
          pnpm -C infra exec sst remove --stage "$STAGE" 2>&1 || true

      - name: Comment deploy status
        if: always() && steps.gate.outputs.skip != 'true' && steps.deploy.outputs.stage != ''
        uses: actions/github-script@v9
        env:
          STAGE: ${{ steps.deploy.outputs.stage }}
          # Overall job status includes reconciliation and any later verification,
          # not just the earlier SST command.
          DEPLOY_STATUS: ${{ job.status }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const stage = process.env.STAGE;
            const status = process.env.DEPLOY_STATUS;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = status === 'success' ? '✅' : '❌';
            const body = [
              `## ${icon} Preview Deployment`,
              '',
              `| Item | Value |`,
              `|------|-------|`,
              `| Stage | \`${stage}\` |`,
              `| Status | ${status} |`,
              `| Region | \`${process.env.AWS_REGION}\` |`,
              `| Run | [View logs](${runUrl}) |`,
              '',
              `SSM parameters deployed by this stage: \`/mem9-on-aws/${stage}/...\``,
              '',
              `*The preview is removed automatically when the PR is closed.*`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

  # ───────────────────────────────────────────────────────────────────────────
  # cleanup-preview — PR closed/merged → remove stage `pr-N`.
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-preview:
    name: Cleanup PR Preview
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    needs: [application-region]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.base.ref == 'main'
    # Budget: 15m first remove + up to 20m ENI detach wait + 15m retry, plus
    # checkout/pnpm/install. The old 30m cut the FIRST remove off mid-flight (#146),
    # which is what leaked the security groups — the job timeout must stay strictly
    # above the sum of the inner bounds so the retry path can always complete.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: ${{ needs.application-region.outputs.cleanup_region }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::AWS_ROLE_ARN not configured — skipping cleanup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check if stage was ever deployed
        id: check-state
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          STAGE="pr-${PR_NUMBER}"

          # SST writes bootstrap config to /sst/bootstrap (SSM) on first deploy
          # per region. Reading from SSM is deterministic — unlike scanning
          # buckets, which could match a sibling project's state bucket.
          BOOTSTRAP_JSON=$(aws ssm get-parameter \
            --name /sst/bootstrap \
            --query Parameter.Value \
            --output text 2>/dev/null || true)

          if [[ -z "$BOOTSTRAP_JSON" ]]; then
            echo "::notice::No /sst/bootstrap in ${AWS_REGION} — stage was never deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATE_BUCKET=$(echo "$BOOTSTRAP_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
          if [[ -z "$STATE_BUCKET" ]]; then
            echo "::error::Could not parse 'state' from /sst/bootstrap"
            exit 1
          fi

          STATE_KEY="app/mem9-on-aws/${STAGE}.json"
          echo "Looking up s3://${STATE_BUCKET}/${STATE_KEY}"
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "Pulumi state found for ${STAGE} — cleanup required"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No state for ${STAGE} — stage was never deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check-state.outputs.deployed == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: pnpm/action-setup@v6
        if: steps.check-state.outputs.deployed == 'true'
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@v7
        if: steps.check-state.outputs.deployed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        if: steps.check-state.outputs.deployed == 'true'
        run: pnpm -C infra install --frozen-lockfile

      - name: Remove conflicting Pulumi installation
        if: steps.check-state.outputs.deployed == 'true'
        run: |
          sudo rm -f /usr/local/bin/pulumi* 2>/dev/null || true
          rm -rf ~/.config/sst/bin/ ~/.config/sst/plugins/ 2>/dev/null || true

      # #146. `sst remove` deletes the VPC-attached Lambdas quickly, but AWS
      # detaches their hyperplane ENIs ASYNCHRONOUSLY (up to ~20m). Those ENIs hold
      # a dependency on Mem9TaskSg, so Pulumi sits retrying DeleteSecurityGroup
      # against DependencyViolation — and on the stages that leaked, THIS JOB'S
      # timeout fired first and cancelled the remove MID-FLIGHT. The state object
      # was already gone by then, so the stage became invisible to a state-anchored
      # reconciler and its SG + ENIs leaked with nothing tying them to a closed PR.
      #
      # So the remove gets its OWN bound (`timeout`), which the job timeout must
      # never pre-empt. A first attempt that runs out is not a failure: the
      # functions are deleted by then, which is precisely when waiting for the ENIs
      # becomes useful (before the remove they are still in-use — waiting there
      # would poll for 20 minutes and change nothing). Then one retry finishes the
      # remove with the dependency gone, leaving SST state consistent.
      - name: Remove PR stage
        if: steps.check-state.outputs.deployed == 'true'
        shell: bash
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          STAGE="pr-${PR_NUMBER}"
          # Refuse to remove a protected stage name.
          case "$STAGE" in
            prod|main|production) echo "::error::Refusing to remove protected stage $STAGE"; exit 1 ;;
          esac
          # Clear a stale lock left by a previous run — ONCE, before the first
          # attempt. It must not move inside `remove()`: `timeout` sends only
          # SIGTERM, and `sst remove` fans out to a Pulumi engine that can outlive
          # it, so an unlock on the retry path could force-clear the lock still
          # held by a first attempt that is quietly still running. Two engines on
          # one state object is state corruption, not a slow teardown.
          pnpm -C infra exec sst unlock --stage "$STAGE" 2>&1 || true

          # --kill-after escalates to SIGKILL 60s after SIGTERM, so a first attempt
          # that ignores TERM cannot survive into the retry as an orphan.
          remove() {
            timeout --kill-after=60s "$1" \
              pnpm -C infra exec sst remove --stage "$STAGE" --print-logs
          }
          if remove 15m; then
            echo "::notice::Removed stage ${STAGE} on the first attempt"
            exit 0
          fi
          echo "::notice::First remove of ${STAGE} did not finish — waiting for Lambda ENIs to detach, then retrying"
          # The wait's internal budget is checked BETWEEN polls, so a throttled EC2
          # endpoint could overshoot it and push the retry past the job timeout —
          # re-creating the mid-remove cancellation that leaked the resources. Its
          # expiry is a non-failure by design, so an outer bound is safe to ignore.
          timeout --kill-after=60s 22m node scripts/await-eni-detach.mts "$STAGE" || \
            echo "::warning::ENI detach wait exceeded its outer bound — retrying the remove anyway"
          remove 15m

      - name: Comment cleanup status
        if: success() && steps.check-state.outputs.deployed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [`## 🧹 Preview Cleanup`, '', `Stage \`pr-${pr}\` has been removed.`].join('\n'),
            });

  # ───────────────────────────────────────────────────────────────────────────
  # build-and-push-image — build the four arm64 workload images and push them to
  # the out-of-band ECR repositories. Release builds (`push` and
  # `workflow_dispatch`) get `mem9-<sha7>` + `latest`; pull requests get only
  # `pr-<sha7>`. Runs on all three events so previews exercise the real images
  # and prod pins the exact commit. Exposes the per-commit tag as an output that
  # deploy-preview and deploy-prod consume. Hard-fails on release events without
  # AWS_ROLE_ARN; on PR it skips gracefully (matching deploy-preview's gate).
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push-image:
    name: Build & push workload images
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    needs: [application-region, typecheck]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main')
    # arm64 build: native on the self-hosted arm64 pool, QEMU-emulated on
    # ubuntu-latest (slower). Give the go build + emulation headroom.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
    outputs:
      # The per-commit tag, or empty when skipped (PR with no AWS_ROLE_ARN) so
      # downstream jobs can fall back to `latest`.
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_ROLE_ARN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::Guarded workload-boundary migration is incomplete — refusing AWS image publication"
              exit 1
            fi
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview image builds"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::AWS_ROLE_ARN not configured — cannot build/push workload images for prod. Bootstrap the role (scripts/deploy-github-role.sh) and set the secret."
              exit 1
            fi
            echo "::notice::AWS_ROLE_ARN not configured — skipping image builds (preview will fall back to :latest)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Resolve image tag
        id: tag
        if: steps.gate.outputs.skip != 'true'
        # Distinct prefixes so PR-preview churn and release images don't share a
        # lifecycle-expiry window (ecr-repositories.yaml): `pr-<sha7>` for PR
        # builds (expired aggressively), `mem9-<sha7>` for release builds on main
        # (retained long). A prod task pins the release tag by name, so it must
        # never be aged out by preview traffic. GITHUB_SHA is trusted (GitHub-
        # controlled), so it's safe in run:; on a PR it's the ephemeral merge SHA.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/image-tags.mjs

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve per-image tag lists
        id: tags
        if: steps.gate.outputs.skip != 'true'
        # Expand the tested event-to-tag output for each image. This keeps the
        # release/preview decision in one pure function.
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAGS: ${{ steps.tag.outputs.image_tags }}
        run: |
          emit() { # $1 = image name (repo leaf), $2 = output key
            {
              echo "$2<<EOF"
              while IFS= read -r tag; do
                [ -n "$tag" ] && echo "${REGISTRY}/${ECR_NS}/$1:${tag}"
              done <<< "$IMAGE_TAGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          emit mnemo-server mnemo_tags
          emit qwen3-embed  embed_tags
          emit bootstrap    bootstrap_tags
          emit llm-proxy    llm_proxy_tags

      - name: Set up QEMU
        # Enables linux/arm64 emulation on x86 runners (ubuntu-latest). A no-op
        # cost on the native-arm64 self-hosted pool.
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build & push mnemo-server (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/mnemo-server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.mnemo_tags }}
          cache-from: type=gha,scope=mnemo-server
          cache-to: type=gha,mode=max,scope=mnemo-server

      - name: Smoke test mnemo-server EMF framing (non-TTY)
        if: steps.gate.outputs.skip != 'true'
        env:
          MNEMO_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_NS }}/mnemo-server:${{ steps.tag.outputs.image_tag }}
        run: bash scripts/run-mnemo-emf-smoke.sh

      - name: Build & push qwen3-embed (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/qwen3-embed/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.embed_tags }}
          # Distinct cache scope so the heavy model-bake layer caches separately.
          cache-from: type=gha,scope=qwen3-embed
          cache-to: type=gha,mode=max,scope=qwen3-embed

      - name: Build & push bootstrap (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/bootstrap/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.bootstrap_tags }}
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,mode=max,scope=bootstrap

      - name: Build & push llm-proxy (arm64)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/llm-proxy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.llm_proxy_tags }}
          cache-from: type=gha,scope=llm-proxy
          cache-to: type=gha,mode=max,scope=llm-proxy

  # ───────────────────────────────────────────────────────────────────────────
  # deploy-prod — push to main → stage `prod`. HARD-FAILS without AWS_ROLE_ARN.
  # Runs AFTER the image is built+pushed and pins prod to that exact `mem9-<sha7>`.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy prod
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    needs: [application-region, typecheck, build-and-push-image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: prod
    # Full-stack prod: Aurora + the 3-container ECS task (qwen3 image pull + 180s
    # health startPeriod) + the bootstrap run-task. No RDS Proxy (dropped — see
    # infra/db.ts). Fresh bring-up ~30-35m (measured); 50m gives headroom. Prod is
    # singleton/non-cancelable, so a long timeout doesn't waste runners on dupes.
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
      issues: write
    env:
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
    steps:
      - name: Deployment maintenance gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::error::Guarded workload-boundary migration is incomplete — refusing prod deployment"
            exit 1
          fi

      - name: Gate on AWS_ROLE_ARN (hard-fail)
        env:
          HAS_AWS: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$HAS_AWS" ]; then
            echo "::error::AWS_ROLE_ARN not configured — cannot deploy prod. A silent skip would let this push 'succeed' without deploying. Bootstrap the role (scripts/deploy-github-role.sh) and set the secret."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        run: pnpm -C infra install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Preflight — verify role is assumable
        env:
          WORKLOAD_BOUNDARY_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::OIDC role assumed but STS is unusable — check AWS_ROLE_ARN / trust policy"
            exit 1
          fi
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "::error::Role $ROLE_NAME not found — run scripts/deploy-github-role.sh to bootstrap it"
            exit 1
          fi
          if ! WORKLOAD_BOUNDARY_SKIP_DOTENV=true \
            scripts/deploy-workload-permissions-boundary.sh --verify-only; then
            echo "::error::Workload boundary preflight failed; see the diagnostic above"
            exit 1
          fi
          echo "Preflight OK: OIDC deploy role assumed"

      - name: Remove conflicting Pulumi installation
        run: |
          sudo rm -f /usr/local/bin/pulumi* 2>/dev/null || true
          rm -rf ~/.pulumi/plugins/ 2>/dev/null || true
          rm -rf ~/.config/sst/bin/ ~/.config/sst/plugins/ 2>/dev/null || true

      - name: Recover stale SST prod lock
        # Recovers from "Concurrent update detected" left by a previous
        # `sst deploy` that died without releasing its lock. Policy: only
        # unlock if the lock object is OLDER than this job's timeout (20 min)
        # + a 10-minute buffer = 30 min. Anything younger could be a genuinely
        # concurrent deploy (a developer running `sst deploy --stage prod`).
        shell: bash
        env:
          STALE_LOCK_AGE_MINUTES: "30"
        run: |
          set -euo pipefail
          BOOTSTRAP_JSON=$(aws ssm get-parameter \
            --name /sst/bootstrap \
            --query Parameter.Value \
            --output text 2>/dev/null || true)
          if [[ -z "$BOOTSTRAP_JSON" ]]; then
            echo "::notice::No /sst/bootstrap in ${AWS_REGION} — first prod deploy, no lock to recover"
            exit 0
          fi
          STATE_BUCKET=$(echo "$BOOTSTRAP_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
          if [[ -z "$STATE_BUCKET" ]]; then
            echo "::error::Could not parse 'state' from /sst/bootstrap"
            exit 1
          fi
          # SST's lock key layout has varied across versions; probe the common
          # variants and unlock via the CLI (which knows the real key) if any
          # is present + stale.
          LAST_MODIFIED=""
          for LOCK_KEY in "app/mem9-on-aws/.lock/prod.json" "lock/mem9-on-aws/prod.json"; do
            LAST_MODIFIED=$(aws s3api head-object --bucket "$STATE_BUCKET" --key "$LOCK_KEY" \
              --query LastModified --output text 2>/dev/null || true)
            [[ -n "$LAST_MODIFIED" ]] && break
          done
          if [[ -z "$LAST_MODIFIED" ]]; then
            echo "No lock object — proceeding with deploy"
            exit 0
          fi
          # One-liner python3 -c (no heredoc): a `<<'PY'` heredoc inside a YAML
          # `run: |` block keeps the closing PY indented, so bash never sees the
          # column-0 terminator and the step dies with "unexpected EOF" the first
          # time a lock exists. Semicolon form has no indentation-significant body.
          AGE_MINUTES=$(python3 -c 'import sys; from datetime import datetime, timezone; last = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print(f"{(datetime.now(timezone.utc) - last).total_seconds() / 60:.1f}")' "$LAST_MODIFIED")
          echo "Lock LastModified: $LAST_MODIFIED (age ${AGE_MINUTES} min)"
          if ! [[ "$AGE_MINUTES" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Could not parse lock age: '${AGE_MINUTES}'"; exit 1
          fi
          if awk "BEGIN { exit !(${AGE_MINUTES} > ${STALE_LOCK_AGE_MINUTES}) }"; then
            echo "::warning::Stale prod lock (age ${AGE_MINUTES} min > ${STALE_LOCK_AGE_MINUTES}). Auto-unlocking."
            pnpm -C infra exec sst unlock --stage prod
          else
            echo "::error::prod lock is fresh (age ${AGE_MINUTES} min <= ${STALE_LOCK_AGE_MINUTES}). Refusing to unlock — a concurrent deploy may be running."
            exit 1
          fi

      - name: Seed OAuth HMAC key (workflow_dispatch only)
        # The OAuth façade's HMAC state-signing key. Empty → the façade returns
        # 503 on /oauth/authorize, so the browser-login flow can't run. This
        # generates a fresh 32-byte key and stores it as an SST secret; the
        # following "Deploy prod stage" re-links it into the façade Lambda's env
        # (SST secrets are build-time `.value` links). Idempotent — re-running
        # rotates the key (existing signed states expire in 10 min anyway).
        # Runs ONLY on a manual dispatch with seed_oauth_hmac=true.
        if: github.event_name == 'workflow_dispatch' && inputs.seed_oauth_hmac
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(openssl rand -base64 32)
          pnpm -C infra exec sst secret set OauthStateHmacKey "$KEY" --stage prod
          echo "::notice::OauthStateHmacKey seeded for prod (re-linked by the deploy below)"

      - name: Resolve Cloudflare account ID
        shell: bash
        env:
          MEM9_FACADE_CUSTOM_DOMAIN: ${{ secrets.MEM9_FACADE_CUSTOM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$MEM9_FACADE_CUSTOM_DOMAIN" ]]; then
            echo "::notice::No production custom domain configured; skipping Cloudflare account resolution"
            exit 0
          fi
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required when MEM9_FACADE_CUSTOM_DOMAIN is set}"
          : "${CLOUDFLARE_ZONE_ID:?CLOUDFLARE_ZONE_ID is required when MEM9_FACADE_CUSTOM_DOMAIN is set}"
          ZONE_JSON=$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}")
          ACCOUNT_ID=$(printf '%s' "$ZONE_JSON" | python3 -c 'import json,re,sys; data=json.load(sys.stdin); value=data.get("result", {}).get("account", {}).get("id", ""); valid=data.get("success") is True and isinstance(value, str) and re.fullmatch(r"[0-9a-f]{32}", value) is not None; print(value) if valid else sys.exit("Cloudflare zone response did not contain a valid account ID")')
          echo "::add-mask::$ACCOUNT_ID"
          printf 'CLOUDFLARE_DEFAULT_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy prod stage
        shell: bash
        # Pin prod to the shared tag built for all workload images in this commit
        # (`mem9-<sha7>`); infra/ecs.ts reads MEM9_IMAGE_TAG.
        env:
          MEM9_IMAGE_TAG: ${{ needs.build-and-push-image.outputs.image_tag }}
          # Preserve an existing production OAuth hostname. New repositories may
          # leave this unset and use the account/Region/stage-derived default.
          # Preview deploys intentionally do not receive this prod-wide value.
          MEM9_COGNITO_DOMAIN_PREFIX: ${{ vars.MEM9_COGNITO_DOMAIN_PREFIX }}
          # Bedrock Project id → the llm-proxy sidecar's OpenAI-Project cost header
          # (infra/ecs.ts BEDROCK_PROJECT). Repo variable set out-of-band by
          # scripts/deploy-bedrock-mantle-project.sh.
          MEM9_BEDROCK_PROJECT: ${{ vars.MEM9_BEDROCK_PROJECT }}
          # llm-proxy Responses route (OpenAI gpt-5.6 terra/luna): the fallback
          # region's Mantle project id + model selector. The region itself is a
          # job-level variable and defaults to us-west-2 when unset.
          MEM9_BEDROCK_PROJECT_OPENAI: ${{ vars.MEM9_BEDROCK_PROJECT_OPENAI }}
          MEM9_LLM_MODEL: ${{ vars.MEM9_LLM_MODEL }}
          # Explicitly false before migration. The guarded migration changes it
          # to true only after every passable role has the exact boundary and
          # permanent enforcement is active. Missing/invalid values fail closed.
          WORKLOAD_BOUNDARY_PROD_ENABLED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          # The image applies the repeatable atomic-ingest migration before the
          # server starts, so one enabled rollout is safe.
          MEM9_DURABLE_INGEST_ENABLED: "1"
          # Explicit opt-in. Missing/empty keeps the schedule and Scheduler role
          # absent; the task definition remains available for report-only runs.
          MEM9_CONSOLIDATION_SCHEDULE_ENABLED: ${{ vars.MEM9_CONSOLIDATION_SCHEDULE_ENABLED }}
          # The cleanup scan's own opt-in (#149). Missing/empty keeps the weekly
          # scan schedule, its group, and its Scheduler role absent while leaving
          # the apply half of the Slack loop intact — so an operator can post an
          # approval list by hand, see it work, and turn the schedule on afterwards.
          # Roll the deploy role's Scheduler iam:PassRole widening out FIRST
          # (scripts/deploy-github-role.sh): without it this deploy AccessDenies on
          # CreateSchedule's PassRole after creating the role and group.
          MEM9_CLEANUP_SCAN_SCHEDULE_ENABLED: ${{ vars.MEM9_CLEANUP_SCAN_SCHEDULE_ENABLED }}
          # Compliance authorizer on the OAuth façade routes — see the preview
          # deploy step above for the full rationale. Must be set here too: the
          # flag is read at synth time, so a prod deploy without it strips the
          # authorizer and reopens the Palisade finding.
          MEM9_FACADE_AUTHORIZER_ENABLED: "1"
          # Optional production hostname. SST creates the regional ACM
          # certificate, API mapping, and DNS-only Cloudflare records.
          # Previews intentionally receive none of these three values.
          MEM9_FACADE_CUSTOM_DOMAIN: ${{ secrets.MEM9_FACADE_CUSTOM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Slack incoming webhook for prod alarm delivery (infra/observability.ts).
          # SST marks this value secret before it enters Pulumi state or Lambda config.
          # Production synthesis fails when the managed sink is unset.
          SST_SECRET_SlackWebhookUrl: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          pnpm -C infra exec sst deploy --stage prod --print-logs 2>&1 | tee sst-deploy.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::SST prod deployment failed (exit $EXIT)"
            exit "$EXIT"
          fi

      - name: Reconcile prod ECS deployment
        env:
          STAGE: prod
        run: node scripts/reconcile-ecs-deployment.mjs --stage "$STAGE"

      - name: Run schema-bootstrap task (prod)
        shell: bash
        # SST DEFINES the one-shot bootstrap task; we run it here (§8), after the
        # deploy created/updated the task def + Aurora. Idempotent (all DDL is
        # IF NOT EXISTS; tenant upsert is ON CONFLICT), so re-running each deploy is
        # safe. Reads the run inputs SST exported to SSM, runs the task with the
        # DB task SG + private subnets (awsvpc, no public IP), and waits for exit 0.
        env:
          STAGE: prod
        run: bash scripts/run-bootstrap-task.sh

      - name: MCP write-search E2E (prod, hard)
        # HARD gate on prod: the full section 6/6a chain must round-trip
        # (Cognito M2M JWT -> AgentCore Gateway -> VPC-attached proxy Lambda ->
        # Cloud Map private DNS -> mnemo-server -> Aurora -> qwen3 -> search).
        # No E2E_SOFT, so a failure fails the prod deploy job (surfaced by the
        # deploy-failure issue below).
        shell: bash
        env:
          STAGE: prod
        run: bash scripts/run-mcp-e2e.sh

      - name: OAuth façade smoke (prod)
        env:
          STAGE: prod
        run: bash scripts/run-oauth-facade-smoke.sh

      - name: Create issue on prod deploy failure
        # failure() fires for any failed step (gate, preflight, lock recovery,
        # deploy, reconciliation) — every one is a prod deploy that didn't land.
        if: failure()
        uses: actions/github-script@v9
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_EVENT: ${{ github.event_name }}
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const subject = (process.env.COMMIT_MSG || '').split('\n')[0].trim() || '(no commit subject)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Prod deploy failed: ${subject}`,
              body: [
                `## Prod deploy failed`,
                '',
                `| Item | Value |`,
                `|------|-------|`,
                `| Commit | [\`${shortSha}\`](${commitUrl}) |`,
                `| Subject | ${subject} |`,
                `| Trigger | \`${process.env.DEPLOY_EVENT}\` |`,
                `| Run | [View logs](${runUrl}) |`,
                '',
                '### Recovery',
                '',
                `1. Inspect the [failed run](${runUrl}).`,
                `2. Fix on a follow-up PR and merge — every push to \`main\` re-triggers the deploy.`,
                `3. Manual re-trigger without a new commit: re-run the failed job from the run page.`,
              ].join('\n'),
              labels: ['bug', 'infrastructure'],
            });
