# Infra CI/CD for the mem9-on-aws SST v4 runtime.
#
# Flow:
#   1. typecheck        — typecheck + unit tests (PR + push-to-main; always runs)
#   2. deploy-preview   — PR opened/synchronized/reopened → deploy stage `pr-N`
#   3. cleanup-preview  — PR closed/merged → remove stage `pr-N`
#   4. deploy-prod      — push to main → deploy stage `prod`
#
# Required GitHub repo secrets:
#   AWS_PREVIEW_ROLE_ARN — pull-request preview and cleanup role.
#   AWS_PROD_ROLE_ARN — approved main-branch image/deployment role.
#   Both are bootstrapped out-of-band by scripts/deploy-github-role.sh.
#
# Optional GitHub repo secret:
#   MEM9_FACADE_CUSTOM_DOMAIN — production OAuth façade hostname, for example
#                  memory.example.com. Unset keeps the execute-api URL.
#   CLOUDFLARE_API_TOKEN — required when the custom hostname is set. Scope it to
#                  Zone:Read + DNS:Edit for that one Cloudflare zone.
#   CLOUDFLARE_ZONE_ID — required when the custom hostname is set. The existing
#                  Cloudflare zone that contains the hostname.
#
# Optional GitHub repo variables:
#   RUNNER_LABEL — JSON runner selector. Native carrier checks require
#                  ["ubuntu-24.04-arm"] on GitHub-hosted runners.
#                  Unset → ubuntu-latest; native carrier checks reject x64.
#   DEPLOYMENT_MAINTENANCE_PAUSED — set to true during the guarded workload-role
#                  migration. Existing AWS jobs fail before assuming the deploy
#                  role; the operator also waits for every prior run to finish.
#   WORKLOAD_BOUNDARY_PROD_ENABLED — explicitly false before migration and set
#                  to true only after every live role is bounded. Every AWS job
#                  stays disabled until true; prod also fails synthesis unless
#                  the value is explicitly true or false.
#   MEM9_LLM_RESPONSES_REGION — independent fallback region for selected OpenAI
#                  GPT models. Unset keeps the runtime/boundary default us-west-2.
#   MEM9_COGNITO_DOMAIN_PREFIX — existing production Cognito domain prefix.
#                  Set this before adopting derived defaults so prod keeps its
#                  current OAuth hostname. Previews intentionally do not use it.
#   MEM9_NAMESPACE_REQUIRED — namespace cutover gate. Leave unset/0 while the
#                  database is additive_ready. Set to 1 only after the guarded
#                  freeze/backfill/enforce run reaches constraints_complete and
#                  namespace/group/M2M bindings have been reconciled.
#   MEM9_TRANSPORT_SIGNING_ACTIVE_SLOT — active transport key slot, `a` or `b`.
#   MEM9_TRANSPORT_SIGNING_SLOT_A_REVISION / SLOT_B_REVISION — increment only
#                  the inactive slot, deploy, then switch the active slot and
#                  deploy again. These selectors are non-secret.
#   MEM9_DECISION_ARTIFACT_BUCKET — exact account-level bucket bootstrapped by
#                  scripts/deploy-decision-artifact-bucket.sh. Unset uses
#                  mem9-audit-<account-id>. The boundary must use the same value.
#
# Workload-boundary maintenance gate revision: 1

name: Infra CI

on:
  # Manual prod redeploy — e.g. to re-link a newly-set SST secret into the
  # deployed Lambda env (SST secrets are build-time links, so setting one needs
  # a redeploy to take effect). `seed_oauth_hmac` optionally (re)generates the
  # OAuth façade's HMAC state-signing key before the deploy.
  workflow_dispatch:
    inputs:
      carrier_before_copy:
        description: "Run only the independently funded premerge carrier build"
        type: boolean
        default: false
      carrier_grant:
        description: "Opaque prepaid carrier grant commitment"
        type: string
        default: ""
      carrier_context:
        description: "Opaque authenticated carrier context commitment"
        type: string
        default: ""
      runtime_cutover:
        description: "Run the guarded runtime credential cutover against an already verified deployment"
        type: boolean
        default: false
      runtime_stage:
        description: "prod, or the numeric pr-N stage owned by this exact branch revision"
        type: string
        default: prod
      runtime_cancellation_mode:
        description: Preview-only cancellation drill or resume; normal preserves ordinary cutover
        type: choice
        options: [ normal, cancel, resume ]
        default: normal
      runtime_retained_data_run:
        description: "Preview only: prior successful pull-request CI run supplying retained data images"
        type: string
        default: ""
      seed_oauth_hmac:
        description: "Generate + set OauthStateHmacKey before deploying (enables the OAuth browser-login flow)"
        type: boolean
        default: false
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - "infra/**"
      - "docker/**"
      - "sst.config.ts"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/runtime-recovery.yml"
      - ".github/actions/runtime-cutover/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      # The OIDC role + ECR repositories are bootstrapped out-of-band via
      # scripts/deploy-github-role.sh / deploy-ecr-repositories.sh — NOT part of
      # the per-PR SST deploy. Re-include templates whose regression tests run
      # in this workflow.
      - "!infra/cloudformation/**"
      - "infra/cloudformation/ecr-repositories.yaml"
      - "infra/cloudformation/github-actions-role.yaml"
      - "infra/cloudformation/ecr-registry-scanning.yaml"
      - "infra/cloudformation/workload-permissions-boundary.yaml"
      - "infra/cloudformation/decision-artifact-bucket.yaml"
      - "infra/cloudformation/decision-artifact-bucket-import.yaml"
      - "infra/cloudformation/memory-namespace-operator-role.yaml"
  push:
    branches: [ main ]
    paths:
      - "infra/**"
      - "docker/**"
      - "sst.config.ts"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/runtime-recovery.yml"
      - ".github/actions/runtime-cutover/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "!infra/cloudformation/**"
      - "infra/cloudformation/ecr-repositories.yaml"
      - "infra/cloudformation/github-actions-role.yaml"
      - "infra/cloudformation/ecr-registry-scanning.yaml"
      - "infra/cloudformation/workload-permissions-boundary.yaml"
      - "infra/cloudformation/decision-artifact-bucket.yaml"
      - "infra/cloudformation/decision-artifact-bucket-import.yaml"
      - "infra/cloudformation/memory-namespace-operator-role.yaml"

# Per-PR concurrency serializes repeated `synchronize` events so the same
# `pr-N` stage never races unlock/deploy/cleanup. Superseded runs are not
# cancelled: a cancelled workflow would also cancel its dependent teardown.
# Push-to-main and manual workflow_dispatch share one serialized prod group.
# The `|| 'unknown'` guard protects format() during push/dispatch events where
# pull_request.number is null.
concurrency:
  group: >-
    ${{
      inputs.carrier_before_copy
        && format('infra-carrier-{0}', github.ref)
        || inputs.runtime_cutover
        && (inputs.runtime_stage == 'prod' && 'infra-deploy-prod' || format('infra-ci-{0}', inputs.runtime_stage))
        || (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && 'infra-deploy-prod'
        || format('infra-ci-pr-{0}', github.event.pull_request.number || 'unknown')
    }}
  cancel-in-progress: false
  queue: max

env:
  MEM9_DECISION_ARTIFACT_BUCKET: ${{ vars.MEM9_DECISION_ARTIFACT_BUCKET }}
  MEM9_TRANSPORT_SIGNING_ACTIVE_SLOT: ${{ vars.MEM9_TRANSPORT_SIGNING_ACTIVE_SLOT }}
  MEM9_TRANSPORT_SIGNING_SLOT_A_REVISION: ${{ vars.MEM9_TRANSPORT_SIGNING_SLOT_A_REVISION }}
  MEM9_TRANSPORT_SIGNING_SLOT_B_REVISION: ${{ vars.MEM9_TRANSPORT_SIGNING_SLOT_B_REVISION }}
  MEM9_CONSOLIDATION_TIMEOUT_SECONDS: ${{ vars.MEM9_CONSOLIDATION_TIMEOUT_SECONDS || '7200' }}
  # The out-of-band ECR repo namespace (infra/cloudformation/ecr-repositories.yaml).
  # build-and-push-image builds four images under it: <ns>/mnemo-server,
  # <ns>/qwen3-embed, <ns>/bootstrap, <ns>/llm-proxy. Deploy stages reference
  # <acct>.dkr.ecr.<region>/<ns>/<name>:<tag>.
  ECR_NS: mem9-on-aws

jobs:
  premerge-carrier-build:
    name: Build premerge root-audit carrier
    if: github.event_name == 'workflow_dispatch' && inputs.carrier_before_copy && !inputs.runtime_cutover
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      statuses: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_PREVIEW_ROLE_ARN: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
      MEM9_CARRIER_WORKER_CONFIG: ${{ secrets.MEM9_CARRIER_WORKER_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the prepaid carrier
        uses: ./.github/actions/ci-carrier-before-copy
        with:
          grant_commitment: ${{ inputs.carrier_grant }}
          context_commitment: ${{ inputs.carrier_context }}

  application-region:
    name: Resolve application region
    if: ${{ !inputs.carrier_before_copy }}
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      cleanup_region: ${{ steps.resolve.outputs.cleanup_region }}
      region: ${{ steps.resolve.outputs.region }}
      region_changed: ${{ steps.resolve.outputs.region_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          path: .application-region-base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate retained preview request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RETAINED_DATA_RUN_ID: ${{ inputs.runtime_retained_data_run }}
          RUNTIME_CUTOVER: ${{ inputs.runtime_cutover && 'true' || 'false' }}
          RUNTIME_STAGE: ${{ inputs.runtime_stage }}
        run: |
          if [[ -n "$RETAINED_DATA_RUN_ID" ]]; then
            [[ "$RUNTIME_CUTOVER" == true && "$RUNTIME_STAGE" =~ ^pr-[1-9][0-9]*$ && "$RETAINED_DATA_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo 'Retained-data rehearsal requires a numeric preview stage and a successful source run ID'
              exit 1
            }
          fi
      - name: Resolve SST AWS provider region
        id: resolve
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          region="$(node scripts/resolve-application-region.mjs)"
          cleanup_region="$region"
          region_changed=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_region="$(
              node scripts/resolve-application-region.mjs \
                --config .application-region-base/sst.config.ts
            )"
            cleanup_region="$base_region"
            if [[ "$region" != "$base_region" ]]; then
              region_changed=true
            fi
          fi
          {
            echo "cleanup_region=$cleanup_region"
            echo "region=$region"
            echo "region_changed=$region_changed"
          } >> "$GITHUB_OUTPUT"
          if [[ "$region_changed" == "true" && "$EVENT_ACTION" != "closed" ]]; then
            echo "::error::Application region changes cannot deploy PR previews. Remove old-region previews and use the dedicated live migration process."
            exit 1
          fi

  changes:
    name: Classify deployment changes
    runs-on: ubuntu-latest
    if: ${{ !inputs.carrier_before_copy && (github.event_name != 'pull_request' || github.event.action != 'closed') }}
    permissions:
      contents: read
    outputs:
      workload_changed: ${{ steps.classify.outputs.workload_changed }}
      app_infra_changed: ${{ steps.classify.outputs.app_infra_changed }}
      aws_mutation_required: ${{ steps.classify.outputs.aws_mutation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/classify-infra-changes.mjs --force-production
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            node scripts/classify-infra-changes.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --merge-base
          else
            node scripts/classify-infra-changes.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # typecheck — runs on every PR (except closed) + push-to-main. No AWS needed.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck & Unit Tests
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    if: ${{ !inputs.carrier_before_copy && (github.event_name == 'push' || github.event.action != 'closed') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install infra dependencies
        run: pnpm -C infra install --frozen-lockfile

      - name: Install root dependencies
        run: npm ci

      - name: Install Pulumi runtime for lifecycle tests
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: 3.256.0

      - name: Type check (infra)
        run: pnpm -C infra typecheck

      - name: Unit tests (infra)
        run: pnpm -C infra test

      - name: Consolidation coverage (infra)
        run: pnpm -C infra test:consolidation:coverage

      - name: Type check (root)
        run: npm run typecheck

      - name: Unit tests (root)
        run: npm test

      - name: Consolidation coverage (root)
        run: npm run test:consolidation:coverage

      - name: Cleanup and recovery coverage (root)
        run: npm run test:cleanup:coverage

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Validate ECR registry scanning template
        run: |
          python -m pip install --disable-pip-version-check 'cfn-lint>=1.39,<2'
          application_region="$(node scripts/resolve-application-region.mjs)"
          cfn-lint infra/cloudformation/ecr-registry-scanning.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/ecr-repositories.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/github-actions-role.yaml --regions us-west-2
          cfn-lint infra/cloudformation/workload-permissions-boundary.yaml --regions us-west-2
          # Application region: this bucket is deployed there, not us-west-2.
          cfn-lint infra/cloudformation/decision-artifact-bucket.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/decision-artifact-bucket-import.yaml --regions "$application_region"
          cfn-lint infra/cloudformation/memory-namespace-operator-role.yaml --regions us-west-2

      - name: Validate workload boundary operator scripts
        run: |
          # pip, not apt: the previous `apt-get update` refreshed every package
          # index to install one tool and left the job at the mercy of mirror
          # latency (two runs hung there until the 20-minute job timeout, with all
          # tests already green). It also could not pin a version, so the same
          # commit could lint against whatever shellcheck the distro happened to
          # ship. 0.11.0.1 wraps upstream 0.11.0, matching what apt installed.
          python -m pip install --disable-pip-version-check 'shellcheck-py==0.11.0.1'
          shellcheck scripts/deploy-workload-permissions-boundary.sh
          shellcheck scripts/deploy-decision-artifact-bucket.sh
          shellcheck scripts/rollout-workload-permissions-boundary.sh
          shellcheck scripts/run-cleanup-scan-task.sh
          shellcheck scripts/run-consolidation-task.sh
          shellcheck scripts/run-slack-approval-e2e.sh
          shellcheck scripts/run-ingest-queue-integration.sh
          shellcheck scripts/run-memory-namespace-integration.sh
          shellcheck scripts/run-runtime-credentials-integration.sh
          shellcheck docker/bootstrap/schema-digest.sh docker/bootstrap/entrypoint.sh docker/mnemo-server/entrypoint.sh
          shellcheck scripts/run-consolidation-storage-integration.sh
          shellcheck scripts/run-consolidation-execution-integration.sh
          shellcheck scripts/run-consolidation-planner-integration.sh
          shellcheck scripts/run-consolidation-scheduling-integration.sh
          shellcheck scripts/run-memory-namespace-e2e.sh
          shellcheck scripts/run-memory-namespace-benchmark.sh
          shellcheck scripts/run-memory-namespace-connection-e2e.sh
          shellcheck scripts/run-human-namespace-preview-e2e.sh
          shellcheck scripts/run-memory-namespace-task.sh
          shellcheck scripts/lib/memory-namespace-operator.sh
          shellcheck scripts/deploy-memory-namespace-operator-role.sh
          shellcheck scripts/deploy-github-role.sh
          shellcheck scripts/verify-deploy-role-isolation.sh

      - name: PostgreSQL durable ingest integration tests
        run: bash scripts/run-ingest-queue-integration.sh

      - name: PostgreSQL namespace migration rehearsal
        run: bash scripts/run-memory-namespace-integration.sh
      - name: PostgreSQL runtime credential isolation
        run: bash scripts/run-runtime-credentials-integration.sh
      - name: PostgreSQL continuous consolidation storage
        run: bash scripts/run-consolidation-storage-integration.sh
      - name: PostgreSQL consolidation execution and budgets
        run: bash scripts/run-consolidation-execution-integration.sh
      - name: PostgreSQL incremental planner and model admission
        run: bash scripts/run-consolidation-planner-integration.sh
      - name: Consolidation scheduling and synthetic fixture integration
        run: bash scripts/run-consolidation-scheduling-integration.sh
      - name: Namespace analysis service isolation
        run: bash scripts/run-analysis-namespace-integration.sh

  # ───────────────────────────────────────────────────────────────────────────
  # deploy-preview — PR opened/synchronized/reopened → stage `pr-N`.
  # Skipped gracefully if AWS_PREVIEW_ROLE_ARN is unset.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: preview-ci
    # Depends on the image build so the preview pulls this PR's freshly-built
    # workload images.
    needs:
      - changes
      - application-region
      - typecheck
      - build-and-push-image
      - build-human-acceptance-image
      - mnemo-nonroot-smoke
    if: >-
      (always() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main' && needs.changes.outputs.aws_mutation_required == 'true' && needs.application-region.result == 'success' && needs.typecheck.result == 'success' && needs.build-and-push-image.result == 'success' && (needs.build-human-acceptance-image.result == 'success' || needs.build-human-acceptance-image.result == 'skipped')) && needs.mnemo-nonroot-smoke.result == 'success'
    # Full-stack fresh preview: Aurora (~13m) + the 3-container ECS task (the
    # ~1.2 GB qwen3 image pull + 180s health-check startPeriod, plus the tiny
    # llm-proxy sidecar) + the bootstrap DB-retry + run-task. No RDS Proxy
    # (dropped — see infra/db.ts), so no proxy warmup wait. Measured first
    # bring-up ~30-35m. The read-only ECS reconciliation budget is just under
    # 30m because the AWS services-stable waiter is fixed at ~10m and proved too
    # short for a fresh preview. A deploy job failure or timeout starts a
    # separate dependent cleanup job; explicit whole-workflow cancellation is
    # operator-controlled and does not guarantee downstream teardown.
    timeout-minutes: 90
    outputs:
      stage: ${{ steps.deploy.outputs.stage }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    env:
      MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
      AWS_REGION: ${{ needs.application-region.outputs.region }}
      ROLE_NAME: github-actions-mem9-on-aws-preview
      MEM9_LLM_RESPONSES_REGION: ${{ vars.MEM9_LLM_RESPONSES_REGION }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Deployment maintenance gate
        env:
          PAUSED: ${{ vars.DEPLOYMENT_MAINTENANCE_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::error::AWS deployments are paused for guarded IAM maintenance"
            exit 1
          fi

      - name: Gate on AWS_PREVIEW_ROLE_ARN
        id: gate
        env:
          BOUNDARY_ENFORCED: ${{ vars.WORKLOAD_BOUNDARY_PROD_ENABLED }}
          HAS_AWS: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
        run: |
          if [ "$BOUNDARY_ENFORCED" != "true" ]; then
            echo "::notice::Guarded workload-boundary migration is incomplete — skipping preview deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HAS_AWS" ]; then
            echo "::notice::AWS_PREVIEW_ROLE_ARN not configured — skipping preview deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.gate.outputs.skip != 'true'
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm -C infra install --frozen-lockfile

      - name: Install preview acceptance dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - id: ci_smoke_source
        name: Verify actual CI smoke source evidence (hard)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MEM9_CI_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          MEM9_CI_EVIDENCE_KMS_KEY_ARN: ${{ secrets.MEM9_CI_EVIDENCE_KMS_KEY_ARN }}
          MEM9_CI_SMOKE_LINEAGE: ${{ secrets.MEM9_CI_SMOKE_LINEAGE }}
        uses: ./.github/actions/ci-smoke-gate
        with:
          mode: source
        continue-on-error: false

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Preflight — verify role is assumable
        if: steps.gate.outputs.skip != 'true'
        env:
          WORKLOAD_BOUNDARY_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! aws sts get-caller-identity >/dev/null 2>&1; then
