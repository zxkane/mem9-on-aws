# Branch-only synthetic channel acceptance. Do not merge this replacement.
# Uses an existing default-branch workflow path for workflow_dispatch --ref.
# No schedule, production source authorization, cloud credentials or memory.
name: Artifact channel smoke (synthetic only)

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Fresh synthetic 64-hex challenge; not an artifact nonce
        type: string
        required: true

permissions: {}

concurrency:
  group: artifact-channel-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first_claim:
    name: First upload
    # The project selector is preserved, but this exercise never uses the pool.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/artifact-channel-smoke' && vars.RUNNER_LABEL == ''
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      receipt: ${{ steps.channel.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install only the pinned artifact client closure
        working-directory: .github/actions/artifact-channel-smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify owner announcement, then upload
        id: channel
        uses: ./.github/actions/artifact-channel-smoke
        with:
          mode: first
          challenge: ${{ inputs.challenge }}
          github-token: ${{ github.token }}

  duplicate_claim:
    name: Duplicate upload
    needs: first_claim
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/artifact-channel-smoke' && vars.RUNNER_LABEL == ''
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install only the pinned artifact client closure
        working-directory: .github/actions/artifact-channel-smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify announcement and require same-name upload conflict
        uses: ./.github/actions/artifact-channel-smoke
        with:
          mode: duplicate
          challenge: ${{ inputs.challenge }}
          github-token: ${{ github.token }}
          first-receipt: ${{ needs.first_claim.outputs.receipt }}
