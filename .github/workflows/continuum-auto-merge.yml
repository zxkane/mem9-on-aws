name: Continuum automatic merge

on:
  workflow_run:
    workflows: [Infra CI, Documentation Security]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: continuum-auto-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    if: github.ref == 'refs/heads/main' && vars.CONTINUUM_AUTO_MERGE_ENABLED == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify current PR evidence and merge
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUUM_AUTO_MERGE_ENABLED: ${{ vars.CONTINUUM_AUTO_MERGE_ENABLED }}
        run: node scripts/merge-continuum-prs.mjs
