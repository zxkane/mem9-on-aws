AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM role + least-privilege policies for GitHub Actions SST v4 deployments
  (zxkane/mem9-on-aws) — BASE SCAFFOLD scope. Grants exactly what the scaffold
  provisions today: SST Pulumi state (S3 + /sst/bootstrap SSM), the `meta`
  stack's SSM parameters under /mem9-on-aws/*, read-only EC2/VPC lookup, STS,
  and a constrained iam:PassRole. Deploy out-of-band via
  `scripts/deploy-github-role.sh` — this stack is NOT managed by Pulumi/SST.

  GRANTS ARE SCAFFOLD-SCOPED. Every future resource TYPE (Aurora, ECS Fargate,
  internal ALB, AgentCore Gateway — the last needs iam:CreateServiceLinkedRole
  for managed VPC Lattice) MUST add its grants to a ManagedPolicy below AND
  re-run `scripts/deploy-github-role.sh` BEFORE the PR that provisions it, or
  the first deploy 403s. See docs/ARCHITECTURE.md for the full resource list.

# IAM is global; hosting the role stack in a specific region is purely a
# CloudFormation decision (CFN scopes are per-region). Pinned to us-west-2 in
# `scripts/deploy-github-role.sh` so a sister stack in another region can't
# collide on the IAM role + ManagedPolicy names (EntityAlreadyExists rollback).

Parameters:
  GitHubOrg:
    Type: String
    Default: zxkane
    Description: GitHub organisation/user that owns the repo.
  GitHubRepo:
    Type: String
    Default: mem9-on-aws
    Description: GitHub repository name. Used in the trust policy and as a
      prefix for IAM role / managed policy names.
  ProjectName:
    Type: String
    Default: mem9-on-aws
    Description: SST app name. Must match `name` in `sst.config.ts` — SSM +
      role ARN scoping uses this prefix.
  OIDCProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub Actions OIDC provider ARN. Leave empty to have
      this template create one. This account already has
      arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com
      — pass it so no duplicate is created (only one provider per URL per
      account is allowed).

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]

Resources:
  # ───────────────────────────────────────────────────────────────────────────
  # OIDC provider — only created when OIDCProviderArn is empty. Reuse the
  # account's existing provider by passing its ARN (the default deploy script
  # does this), so this resource is normally NOT created.
  # ───────────────────────────────────────────────────────────────────────────
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS no longer validates GitHub Actions OIDC thumbprints (since
      # 2023-07), but CloudFormation still requires a valid-format entry.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 1 — Explicit denies. First gate against privilege widening and
  # irreversible account-level operations.
  # ───────────────────────────────────────────────────────────────────────────
  DenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-deny-dangerous
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyIAMUserAndProvider
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:CreateLoginProfile
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:AddUserToGroup
              - iam:CreateAccountAlias
              - iam:UpdateAccountPasswordPolicy
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:CreateSAMLProvider
              - iam:DeleteSAMLProvider
              - iam:DeleteServiceLinkedRole
            Resource: "*"
          - Sid: DenyAccountLevel
            Effect: Deny
            Action:
              - organizations:*
              - account:*
              - sso:*
              - sso-admin:*
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - guardduty:DeleteDetector
              - config:DeleteConfigRule
              - config:StopConfigurationRecorder
            Resource: "*"

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 2 — SST Pulumi state + resource provisioning (the scaffold's real
  # grants). SST v4 provisions via Pulumi (S3 state backend + CloudControl),
  # NOT plain CloudFormation — so the role carries DIRECT resource grants for
  # everything the scaffold creates (SSM parameters), not just cloudformation:*.
  # ───────────────────────────────────────────────────────────────────────────
  CorePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-core
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CFN
            # SST v4 deploys via Pulumi, but the CloudControl API + internal
            # change-sets consume these. Narrowing this is a known cause of
            # mid-stack `sst deploy` failures. This does NOT provision app
            # resources — the direct grants below do that.
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListStackResources
              - cloudformation:ValidateTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListChangeSets
              - cloudformation:TagResource
              - cloudformation:UntagResource
            Resource: "*"
          - Sid: S3State
            # Full S3 surface — Pulumi's AWS provider Read step probes
            # Accelerate/Website/Logging/ObjectLock/Replication/etc. on every
            # bucket refresh regardless of configuration; dropping any of these
            # makes the second `sst deploy` fail on the refresh step. Covers
            # SST's state bucket (`sst-state-{account}-{region}`) + any bucket a
            # stack creates later.
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketAcl
              - s3:PutBucketAcl
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketOwnershipControls
              - s3:PutBucketOwnershipControls
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetBucketNotification
              - s3:PutBucketNotification
              - s3:GetAccelerateConfiguration
              - s3:GetBucketLogging
              - s3:GetBucketRequestPayment
              - s3:GetBucketObjectLockConfiguration
              - s3:GetReplicationConfiguration
              - s3:GetBucketWebsite
              - s3:GetBucketPolicyStatus
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetObjectTagging
              - s3:PutObjectTagging
              - s3:DeleteObjectTagging
            Resource: "*"
          - Sid: STS
            # sts:GetCallerIdentity for the CI pre-deploy preflight (confirms
            # the OIDC-assumed role has usable credentials before deploying).
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"
          - Sid: PreflightGetRole
            # The CI preflight also runs `aws iam get-role --role-name
            # github-actions-<repo>` to surface a clear "role not bootstrapped"
            # error instead of a cryptic Pulumi timeout. Without iam:GetRole the
            # preflight itself 403s and reports "role not found" even when the
            # role exists — so grant it, scoped to THIS role's own ARN only.
            Effect: Allow
            Action:
              - iam:GetRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/github-actions-${GitHubRepo}

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 3 — Scaffold resource grants: SSM (state + the meta stack's params),
  # EC2/VPC read-only lookup, and a constrained iam:PassRole.
  # ───────────────────────────────────────────────────────────────────────────
  ScaffoldPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-scaffold
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SSMRead
            # SST reads /sst/bootstrap from any region (cleanup-preview probes
            # it); the meta stack + CI read /mem9-on-aws/*. Read is broad — the
            # role never reads other projects' trees in practice.
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:DescribeParameters
              - ssm:ListTagsForResource
            Resource: "*"
          - Sid: SSMWrite
            # THE grant that lets the `meta` stack create its SSM parameters —
            # without it the first `sst deploy` 403s. Scoped to this project's
            # SSM tree + /sst/bootstrap (SST writes bootstrap config there on
            # first deploy in a region).
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
            Resource:
              - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/*
              - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/mem9-on-aws/*
          - Sid: EC2VpcReadOnly
            # Read-only VPC lookup for infra/vpc.ts (resolveVpc). Pulumi's
            # getVpcOutput reads VPC *attributes* (DNS support/hostnames) via
            # ec2:DescribeVpcAttribute — not just DescribeVpcs — so that call is
            # load-bearing (its absence 403'd the first CI preview deploy). The
            # sibling *Attribute reads are added proactively for the same reason
            # (Pulumi probes them on VPC/subnet refresh). Describe* has no
            # per-resource ARN, so Resource must be "*".
            Effect: Allow
            Action:
              - ec2:DescribeVpcs
              - ec2:DescribeVpcAttribute
              - ec2:DescribeSubnets
              - ec2:DescribeRouteTables
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeNetworkAcls
              - ec2:DescribeSecurityGroups
              # DescribeNetworkInterfaces: Pulumi's SG delete step lists the ENIs
              # still using a security group before deleting it (ECS task ENIs).
              # Its absence 403'd the pr-7 teardown's Mem9DbSg delete.
              - ec2:DescribeNetworkInterfaces
            Resource: "*"
          - Sid: PassRoleConstrained
            # No role is passed by the scaffold today, but future stacks (ECS
            # task/execution roles, Lambda roles) will. Pre-scope PassRole to
            # this project's role names + SST's name-truncation variants, gated
            # by PassedToService — never Resource "*", never unconstrained.
            # (rds.amazonaws.com was dropped with the RDS Proxy — plain Aurora
            # cluster/instance take no roleArn, so nothing passes a role to RDS.)
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-aws-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-aw-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-a-*
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - ecs-tasks.amazonaws.com

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 4 — Database stack (infra/db.ts): Aurora PostgreSQL Serverless v2 +
  # Secrets Manager (static master creds) + the EC2 primitives a DB subnet
  # group / security group need. NO RDS Proxy (dropped 2026-07-12, §3a — mem9
  # connects to the Aurora writer endpoint directly). Its own ManagedPolicy so
  # the broad RDS create surface doesn't push CorePolicy/ScaffoldPolicy past
  # IAM's 6144-byte per-policy cap, and the DB footprint is auditable in one place.
  #
  # ADDED for the Aurora PR — must be live (re-run scripts/deploy-github-role.sh)
  # BEFORE that PR's first deploy, or the deploy 403s on the first RDS/Secret
  # create (CLAUDE-AWS "new resource TYPE needs grants first" rule).
  # ───────────────────────────────────────────────────────────────────────────
  DatabasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-database
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RDS
            # Aurora cluster + instance + DB subnet group + parameter groups.
            # RDS has no useful per-resource ARN granularity for many Describe/
            # Create calls (and Pulumi refreshes probe broadly), so Resource "*".
            # Guarded by the DenyPolicy against account-level RDS abuse.
            # (RDS Proxy dropped 2026-07-12 — no rds:*DBProxy* actions here; see
            # infra/db.ts header + docs/ARCHITECTURE.md §3a for why.)
            Effect: Allow
            Action:
              - rds:CreateDBCluster
              - rds:ModifyDBCluster
              - rds:DeleteDBCluster
              - rds:DescribeDBClusters
              - rds:CreateDBInstance
              - rds:ModifyDBInstance
              - rds:DeleteDBInstance
              - rds:DescribeDBInstances
              - rds:CreateDBSubnetGroup
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:DescribeDBSubnetGroups
              - rds:CreateDBClusterParameterGroup
              - rds:ModifyDBClusterParameterGroup
              - rds:DeleteDBClusterParameterGroup
              - rds:DescribeDBClusterParameterGroups
              - rds:DescribeDBClusterParameters
              # DB-INSTANCE parameter group — SST's Aurora creates a `pg:` group
              # (Mem9DbParameterGroup) for the instance, distinct from the
              # cluster-level group above. Both families are needed.
              - rds:CreateDBParameterGroup
              - rds:ModifyDBParameterGroup
              - rds:DeleteDBParameterGroup
              - rds:DescribeDBParameterGroups
              - rds:DescribeDBParameters
              - rds:DescribeGlobalClusters
              - rds:DescribeDBEngineVersions
              - rds:ListTagsForResource
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
            Resource: "*"
          - Sid: RDSServiceLinkedRoles
            # RDS provisions service-linked roles on first use in an account.
            # Scope CreateServiceLinkedRole to the two RDS service namespaces
            # (the DenyPolicy blocks Delete of any SLR). This is the grant the
            # panel flagged as needed once a real AWS-managed service (RDS)
            # enters the stack.
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - rds.amazonaws.com
                  - rds.application-autoscaling.amazonaws.com
          - Sid: RDSServiceLinkedRoleLookup
            # SST's Aurora does a GetRole on the RDS service-linked role
            # (AWSServiceRoleForRDS) to decide whether CreateServiceLinkedRole is
            # needed. Grant this read explicitly on the SLR ARN (+ the
            # autoscaling SLR); the customer role lifecycle (CreateRole/etc.) for
            # this project's mem9-on-aws-* roles lives in ComputePolicy's
            # EcsTaskRoles now — the RDS-Proxy customer role is gone.
            Effect: Allow
            Action:
              - iam:GetRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS
              - !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/rds.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_RDSCluster
          # (Sid: RdsProxyRole removed 2026-07-12 — the RDS Proxy was dropped, so
          # SST no longer creates the Mem9DbProxyRole customer role. The generic
          # mem9-on-aws-* IAM role lifecycle needed by the rest of the stack is
          # granted in ComputePolicy's EcsTaskRoles.)
          - Sid: SecretsManager
            # sst.aws.Aurora creates its OWN secret `<app>-<stage>-Mem9DbSecret
            # -<random>` (the cluster master creds) holding a static RandomPassword
            # — it does NOT use RDS manageMasterUserPassword, so there is NO
            # `rds!`-prefixed managed secret and NO built-in rotation. The
            # auto-name has no leading slash, so scope to the `mem9-on-aws-*`
            # prefix. CreateSecret can't be resource-scoped (no ARN at create
            # time) → its own statement below.
            Effect: Allow
            Action:
              - secretsmanager:UpdateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:GetResourcePolicy
              - secretsmanager:PutResourcePolicy
              - secretsmanager:DeleteResourcePolicy
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:mem9-on-aws-*
          - Sid: SecretsManagerCreate
            # CreateSecret is authorized before the resource ARN exists, so it
            # can't be resource-scoped. Split out with Resource "*"; every
            # subsequent op on the secret is governed by the name-prefixed
            # statement above, and the DenyPolicy blocks account-level abuse.
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
            Resource: "*"
          - Sid: EC2ForDatabase
            # Security-group lifecycle for the Aurora cluster + RDS Proxy SGs.
            # DescribeVpcs/Subnets already granted in ScaffoldPolicy (read-only);
            # here add the SG create/authorize surface. No per-resource ARN on
            # create, so Resource "*"; the SG rules themselves scope 5432 to the
            # task SG at the resource level in infra/db.ts.
            Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeSecurityGroupRules
            Resource: "*"
          - Sid: KMSForRds
            # Aurora storage + the Secrets Manager secret use the AWS-managed
            # keys (aws/rds, aws/secretsmanager) by default. Pulumi refreshes
            # read key metadata; grant the read/describe + grant-creation surface
            # AWS-managed-key usage needs. Account-scoped, never Resource-widened
            # to a customer-managed-key delete.
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:ListAliases
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 5 — Compute (infra/ecs.ts): ECS Fargate cluster + service + task
  # definition, its task/execution IAM roles, CloudWatch Logs, ECR pull (for the
  # container image), and CloudMap (SST auto-creates a service-discovery name for
  # a no-load-balancer service). Its own ManagedPolicy to stay under IAM's
  # 6144-byte per-policy cap and keep the compute footprint auditable.
  #
  # ADDED for the ECS PR — must be live (re-run scripts/deploy-github-role.sh)
  # BEFORE that PR's first deploy, or the deploy 403s on the first ECS/role/log
  # create (CLAUDE-AWS "new resource TYPE needs grants first").
  # ───────────────────────────────────────────────────────────────────────────
  ComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-compute
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ECS
            # Cluster + service + task-definition lifecycle. ECS has limited
            # per-resource ARN granularity on many describe/register calls and
            # Pulumi refreshes probe broadly, so Resource "*"; the DenyPolicy
            # guards against account-level abuse.
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:DescribeClusters
              - ecs:UpdateCluster
              - ecs:PutClusterCapacityProviders
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:DescribeServices
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:ListTaskDefinitions
              - ecs:DescribeTasks
              - ecs:ListTasks
              # RunTask + StopTask: CI runs the one-shot schema-bootstrap task
              # (infra/bootstrap.ts) via `aws ecs run-task` after deploy, then
              # polls DescribeTasks for its exit code. RunTask has no useful
              # per-resource ARN granularity here (task-def ARNs are versioned);
              # Resource "*" with the DenyPolicy guarding account-level abuse.
              - ecs:RunTask
              - ecs:StopTask
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:ListTagsForResource
            Resource: "*"
          - Sid: ECRPull
            # Pull the container image (placeholder public image now; the
            # mem9 arm64 image from our own ECR later). GetAuthorizationToken has
            # no resource scope.
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:DescribeRepositories
              - ecr:DescribeImages
              - ecr:ListImages
            Resource: "*"
          - Sid: LogsDescribe
            # logs:DescribeLogGroups is a LIST operation with no per-resource ARN
            # (the Pulumi provider reads it as `log-group::log-stream:`), so it
            # MUST be Resource "*" — scoping it to /sst/* 403s the ECS log-group
            # read. Split out from the scoped write actions below.
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: "*"
          - Sid: Logs
            # CloudWatch Logs group for the ECS task. SST's default container log
            # group is `/sst/cluster/<cluster>/<service>/<container>`, covered by
            # the `/sst/*` ARNs below.
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/sst/*
              - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/sst/*:*
          - Sid: EcsTaskRoles
            # SST creates the task role + task-execution role for the service.
            # Scoped to this project's auto-named roles + SST truncation variants.
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              # Required for iam:DeleteRole on teardown — the provider reads the
              # role's instance profiles before deleting (see RdsProxyRole note).
              - iam:ListInstanceProfilesForRole
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-aws-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-aw-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/mem9-on-a-*
          - Sid: AppAutoScaling
            # SST's Service ALWAYS provisions an Application Auto Scaling target +
            # CPU & memory target-tracking policies (even at the min:1/max:1
            # default — createAutoScaling runs unconditionally). Target-tracking
            # auto-creates CloudWatch alarms (next statement). Without these the
            # first deploy 403s at RegisterScalableTarget. No per-resource ARN.
            Effect: Allow
            Action:
              - application-autoscaling:RegisterScalableTarget
              - application-autoscaling:DeregisterScalableTarget
              - application-autoscaling:DescribeScalableTargets
              - application-autoscaling:PutScalingPolicy
              - application-autoscaling:DeleteScalingPolicy
              - application-autoscaling:DescribeScalingPolicies
              - application-autoscaling:DescribeScalingActivities
              - application-autoscaling:ListTagsForResource
              - application-autoscaling:TagResource
              - application-autoscaling:UntagResource
            Resource: "*"
          - Sid: CloudWatchAlarmsForScaling
            # Target-tracking scaling policies auto-provision CloudWatch alarms.
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
            Resource: "*"
          - Sid: AppAutoScalingSLR
            # First app-autoscaling use in the account needs its service-linked
            # role (distinct from the RDS one in DatabasePolicy).
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName: application-autoscaling.amazonaws.com
          - Sid: ServiceDiscovery
            # RESERVED, currently unused: SST only creates a CloudMap service
            # (servicediscovery) when the cluster's `vpc` is an `sst.aws.Vpc`
            # component that carries a cloudmapNamespaceId. This skeleton passes a
            # RAW VPC object (id + subnets + SG), so no CloudMap resource is
            # created and the service has no stable DNS name until the deferred
            # ALB (Gateway PR) lands. Kept minimal so a future Vpc-based cluster
            # doesn't 403; harmless over-grant otherwise.
            Effect: Allow
            Action:
              - servicediscovery:CreateService
              - servicediscovery:DeleteService
              - servicediscovery:GetService
              - servicediscovery:ListServices
              - servicediscovery:GetNamespace
              - servicediscovery:ListNamespaces
              - servicediscovery:GetOperation
              - servicediscovery:TagResource
              - servicediscovery:ListTagsForResource
            Resource: "*"

  # ───────────────────────────────────────────────────────────────────────────
  # Policy 6 — Image build+push (.github/workflows/infra-ci.yml →
  # build-and-push-image). CI on push-to-main builds the mnemo-server arm64 image
  # (docker buildx) and pushes it to the OUT-OF-BAND ECR repo
  # (infra/cloudformation/ecr-repositories.yaml → mem9-on-aws/mnemo-server).
  #
  # DISTINCT from ComputePolicy's ECRPull (the task PULLS at runtime): this is the
  # CI PUSH surface. Its own ManagedPolicy so (a) ComputePolicy stays under IAM's
  # 6144-byte per-policy cap, and (b) the "who can push images" footprint is
  # auditable in one place. GetAuthorizationToken is already granted (ECRPull).
  # Push actions are scoped to the ONE mnemo-server repo ARN (Tokyo — where the
  # out-of-band repo lives; the role stack itself is in us-west-2 but ECR ARNs are
  # regional).
  #
  # ADDED for the mnemo-server image PR — must be live (re-run
  # scripts/deploy-github-role.sh) BEFORE that PR's first push-to-main build, or
  # the build 403s on the first PutImage.
  # ───────────────────────────────────────────────────────────────────────────
  ImageBuildPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GitHubRepo}-image-build
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ECRPushToken
            # GetAuthorizationToken has no resource scope; needed for `docker
            # login` before pushing. (Also granted in ComputePolicy's ECRPull for
            # the deploy path; harmless to have on both, keeps this policy
            # self-contained.)
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: ECRPush
            # Upload layers + put the manifest, scoped to the FOUR out-of-band
            # repos CI pushes to (mnemo-server, qwen3-embed, bootstrap, llm-proxy).
            # BatchCheckLayerAvailability lets buildx skip re-uploading existing
            # layers. DescribeRepositories confirms a repo exists before pushing
            # (clear error if the ECR bootstrap wasn't run).
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:DescribeRepositories
            Resource:
              - !Sub arn:aws:ecr:ap-northeast-1:${AWS::AccountId}:repository/${ProjectName}/mnemo-server
              - !Sub arn:aws:ecr:ap-northeast-1:${AWS::AccountId}:repository/${ProjectName}/qwen3-embed
              - !Sub arn:aws:ecr:ap-northeast-1:${AWS::AccountId}:repository/${ProjectName}/bootstrap
              - !Sub arn:aws:ecr:ap-northeast-1:${AWS::AccountId}:repository/${ProjectName}/llm-proxy

  # ───────────────────────────────────────────────────────────────────────────
  # IAM Role — assumed by GitHub Actions via OIDC.
  # ───────────────────────────────────────────────────────────────────────────
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-actions-${GitHubRepo}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOIDCProvider, !Ref GithubOidc, !Ref OIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Trust scope: only the subjects CI actually presents. NOT the
                # broad `:*`. GitHub branch protection gates which workflows run.
                #   - environment:prod — the deploy-prod job sets
                #     `environment: prod`, which makes GitHub mint the OIDC token
                #     with sub=`repo:<org>/<repo>:environment:prod` (NOT the
                #     branch ref). This entry is load-bearing: without it the prod
                #     job 403s at AssumeRoleWithWebIdentity before it can deploy.
                #   - ref:refs/heads/main — any non-environment push job on main.
                #   - pull_request — typecheck / preview / cleanup on PRs.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:prod
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:pull_request
      ManagedPolicyArns:
        - !Ref DenyPolicy
        - !Ref CorePolicy
        - !Ref ScaffoldPolicy
        - !Ref DatabasePolicy
        - !Ref ComputePolicy
        - !Ref ImageBuildPolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  RoleArn:
    Description: >
      Set this value as the GitHub repository secret AWS_ROLE_ARN. Run
      `gh secret set AWS_ROLE_ARN --repo zxkane/mem9-on-aws --body "<role-arn>"`
      after the stack deploys (deploy-github-role.sh prints it).
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn
