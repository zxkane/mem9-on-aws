AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OUT-OF-BAND ECR repos for mem9-on-aws (not SST-managed) so `sst remove` can't
  wipe image history: mnemo-server (server, §4), qwen3-embed (embed sidecar, §7),
  bootstrap (schema-bootstrap task, §8), llm-proxy (LLM smart-ingest sidecar, §7).
  CI tags mem9-<sha>/latest (release) + pr-<sha> (preview); each repo's lifecycle
  keeps them on separate schedules.
  Deploy via scripts/deploy-ecr-repositories.sh in ap-northeast-1. See §4.

Parameters:
  ProjectName:
    Type: String
    Default: mem9-on-aws
    Description: SST app name; used as the ECR repository namespace prefix so the
      repo URI reads .../mem9-on-aws/mnemo-server.

Resources:
  # ───────────────────────────────────────────────────────────────────────────
  # mnemo-server image repository. Namespaced under the project so a single
  # account can host sibling projects' repos without collision.
  # ───────────────────────────────────────────────────────────────────────────
  MnemoServerRepo:
    Type: AWS::ECR::Repository
    # Retain on stack delete — the image history is the deploy artifact; never
    # let tearing down this bootstrap stack drop the images prod depends on.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}/mnemo-server
      # MUTABLE: CI pushes a rolling `latest` tag alongside the immutable
      # per-commit `mem9-<sha7>` tag; `latest` must be overwritable. The
      # per-commit tag is never re-pushed in practice (new commit = new sha).
      ImageTagMutability: MUTABLE
      # Encryption at rest with the ECR-managed AES256 key (no CMK to manage;
      # data-ownership is satisfied — the images live in the operator's account).
      EncryptionConfiguration:
        EncryptionType: AES256
      # PR-preview (`pr-<sha7>`) and release (`mem9-<sha7>`) images use DISTINCT
      # tag prefixes (.github/workflows/infra-ci.yml → Resolve image tag) so they
      # don't share one expiry window. This matters because a prod task pins its
      # release tag BY NAME and Fargate re-resolves tag→digest on every task
      # (re)start — if preview churn aged a still-referenced release tag out of a
      # shared window, a prod restart would hit ImageNotFound and fail to recover.
      # So:
      #   - `pr-*`   → expire aggressively (7 days) — previews are torn down with
      #     their stage; images just need to outlive an open PR's review cycle.
      #   - `mem9-*` → keep the last 30 releases (a generous rollback window that
      #     preview traffic can never encroach on).
      #   - untagged → expire after 3 days (orphaned layers from overwritten
      #     `latest`, which floats to the newest `mem9-*` on each main merge).
      # Rule priority: pr-* first (lowest number = evaluated first).
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire pr-<sha> preview images after 7 days (they die with their PR stage).",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["pr-"],
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the last 30 mem9-<sha> release images; expire older ones. Prod pins one of these by name — never let preview traffic age it out.",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["mem9-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 3,
                "description": "Expire untagged images after 3 days (orphaned layers from overwritten `latest`).",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 3
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # ───────────────────────────────────────────────────────────────────────────
  # qwen3-embed sidecar image (§7). Same tag scheme + lifecycle as mnemo-server.
  # ───────────────────────────────────────────────────────────────────────────
  Qwen3EmbedRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}/qwen3-embed
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      # Identical policy to mnemo-server: pr-* expire 7d, keep 30 mem9-*, untagged 3d.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              { "rulePriority": 1, "description": "Expire pr-<sha> preview images after 7 days.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["pr-"], "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" } },
              { "rulePriority": 2, "description": "Keep the last 30 mem9-<sha> release images.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["mem9-"], "countType": "imageCountMoreThan", "countNumber": 30 },
                "action": { "type": "expire" } },
              { "rulePriority": 3, "description": "Expire untagged images after 3 days.",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 3 },
                "action": { "type": "expire" } }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # ───────────────────────────────────────────────────────────────────────────
  # bootstrap one-shot task image (§8). Same tag scheme + lifecycle.
  # ───────────────────────────────────────────────────────────────────────────
  BootstrapRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}/bootstrap
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              { "rulePriority": 1, "description": "Expire pr-<sha> preview images after 7 days.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["pr-"], "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" } },
              { "rulePriority": 2, "description": "Keep the last 30 mem9-<sha> release images.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["mem9-"], "countType": "imageCountMoreThan", "countNumber": 30 },
                "action": { "type": "expire" } },
              { "rulePriority": 3, "description": "Expire untagged images after 3 days.",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 3 },
                "action": { "type": "expire" } }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # ───────────────────────────────────────────────────────────────────────────
  # llm-proxy sidecar image (§7 LLM smart-ingest). Same tag scheme + lifecycle.
  # ───────────────────────────────────────────────────────────────────────────
  LlmProxyRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}/llm-proxy
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              { "rulePriority": 1, "description": "Expire pr-<sha> preview images after 7 days.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["pr-"], "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" } },
              { "rulePriority": 2, "description": "Keep the last 30 mem9-<sha> release images.",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["mem9-"], "countType": "imageCountMoreThan", "countNumber": 30 },
                "action": { "type": "expire" } },
              { "rulePriority": 3, "description": "Expire untagged images after 3 days.",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 3 },
                "action": { "type": "expire" } }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  MnemoServerRepoUri:
    Description: >
      The mnemo-server ECR repository URI (without a tag). CI appends
      `:mem9-<sha7>` / `:latest`; infra/ecs.ts composes the same URI from the
      account + region + this namespace to reference the image read-only.
    Value: !GetAtt MnemoServerRepo.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-MnemoServerRepoUri
  MnemoServerRepoName:
    Description: The ECR repository name (namespace/repo form).
    Value: !Ref MnemoServerRepo
    Export:
      Name: !Sub ${AWS::StackName}-MnemoServerRepoName
  Qwen3EmbedRepoUri:
    Description: The qwen3-embed sidecar ECR repository URI (without a tag).
    Value: !GetAtt Qwen3EmbedRepo.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-Qwen3EmbedRepoUri
  BootstrapRepoUri:
    Description: The bootstrap one-shot task ECR repository URI (without a tag).
    Value: !GetAtt BootstrapRepo.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-BootstrapRepoUri
  LlmProxyRepoUri:
    Description: The llm-proxy sidecar ECR repository URI (without a tag).
    Value: !GetAtt LlmProxyRepo.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-LlmProxyRepoUri
