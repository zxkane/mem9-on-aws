AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retained, operator-owned permissions boundary for mem9-on-aws application
  workload roles. Deploy out of band before the guarded role migration.

Parameters:
  ApplicationRegion:
    Type: String
    Default: ap-northeast-1
    AllowedPattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]$"
    Description: Region containing the mem9-on-aws workload resources.
  BedrockProjectArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:bedrock-mantle:[a-z0-9-]+:[0-9]{12}:project/[A-Za-z0-9_-]+$"
    Description: Exact operator-owned Bedrock Mantle project used by smart ingest.
  OpenAiBedrockProjectArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:[a-z0-9-]+:bedrock-mantle:[a-z0-9-]+:[0-9]{12}:project/[A-Za-z0-9_-]+)?$"
    Description: >
      Optional second Bedrock Mantle project ARN for the llm-proxy Responses
      route (OpenAI reasoning models; regional project in the responses
      region, e.g. us-west-2). Empty keeps the boundary unchanged.
  PolicyRevision:
    Type: String
    Default: r1
    AllowedPattern: "^r[0-9]{1,20}$"
    Description: >
      Semantics-neutral policy document revision. The guarded updater changes
      this value to force CloudFormation to reconcile direct managed-policy drift.

Conditions:
  HasOpenAiBedrockProject: !Not [!Equals [!Ref OpenAiBedrockProjectArn, ""]]

Resources:
  WorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: mem9-on-aws-workload-boundary
      Description: Maximum runtime permissions for mem9-on-aws workload roles
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Resource policies can grant directly to assumed-role sessions without
          # an explicit boundary allow. The explicit Deny/NotAction below is the
          # action ceiling; this Allow only admits identity-policy permissions
          # that survive every explicit deny.
          - Sid: AllowRuntimeIdentityPermissions
            Effect: Allow
            Action: "*"
            Resource: "*"
          - Sid: !Sub DenyOutsideRuntimeActionCeiling${PolicyRevision}
            Effect: Deny
            NotAction:
              - bedrock-mantle:CreateInference
              - bedrock-mantle:GetProject
              - bedrock-mantle:ListProjects
              - bedrock-mantle:ListTagsForResource
              - ecs:RunTask
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - lambda:InvokeFunction
              - iam:PassRole
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - secretsmanager:GetSecretValue
              - sqs:SendMessage
              - sns:Publish
              - ssm:GetParameters
              # The Slack approval record (#123). Reserved ahead of the writer,
              # which does not exist yet: Slack's 3-second ACK budget cannot
              # cover a cleanup run, so the facade Lambda will persist the
              # approved decision-list hash and trigger the apply task rather
              # than delete inline. Scoped by both
              # DenyProjectRuntimeOutsideResources and the tighter
              # DenyPutParameterOutsideApprovalRecords below.
              - ssm:PutParameter
              - ec2:AssignPrivateIpAddresses
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:UnassignPrivateIpAddresses
              - ecr:GetAuthorizationToken
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - kms:Decrypt
              - bedrock-mantle:CallWithBearerToken
            Resource: "*"
          - Sid: DenyProjectRuntimeOutsideResources
            Effect: Deny
            Action:
              - bedrock-mantle:CreateInference
              - bedrock-mantle:GetProject
              - bedrock-mantle:ListProjects
              - bedrock-mantle:ListTagsForResource
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - lambda:InvokeFunction
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - secretsmanager:GetSecretValue
              - sqs:SendMessage
              - sns:Publish
              - ssm:GetParameters
              - ssm:PutParameter
            NotResource:
              - !Ref BedrockProjectArn
              # AWS::NoValue removes this entry entirely when unconfigured, so
              # the default boundary keeps its historic shape.
              - !If [HasOpenAiBedrockProject, !Ref OpenAiBedrockProjectArn, !Ref "AWS::NoValue"]
              - !Sub arn:${AWS::Partition}:ecr:${ApplicationRegion}:${AWS::AccountId}:repository/mem9-on-aws/*
              - !Sub arn:${AWS::Partition}:lambda:${ApplicationRegion}:${AWS::AccountId}:function:mem9-on-aws-*
              - !Sub arn:${AWS::Partition}:logs:${ApplicationRegion}:${AWS::AccountId}:log-group:/sst/*
              - !Sub arn:${AWS::Partition}:logs:${ApplicationRegion}:${AWS::AccountId}:log-group:/aws/lambda/mem9-on-aws-*
              - !Sub arn:${AWS::Partition}:secretsmanager:${ApplicationRegion}:${AWS::AccountId}:secret:mem9-on-aws-*
              - !Sub arn:${AWS::Partition}:sqs:${ApplicationRegion}:${AWS::AccountId}:AlertTransportFailureQueue-*
              - !Sub arn:${AWS::Partition}:sqs:${ApplicationRegion}:${AWS::AccountId}:AlertExecutionFailureQueue-*
              - !Sub arn:${AWS::Partition}:sns:${ApplicationRegion}:${AWS::AccountId}:mem9-on-aws-*-alerts
              - !Sub arn:${AWS::Partition}:ssm:${ApplicationRegion}:${AWS::AccountId}:parameter/mem9-on-aws/*
          # The statement above scopes the write to the PROJECT prefix, i.e. every
          # stage's whole SSM tree. That is too wide for a write, and this ceiling
          # is the only control on it: identity policies are PR-authored, and the
          # deploy role's DenyUnboundedProjectRolePolicyWrites only requires that
          # the boundary be ATTACHED, never constrains its content. Preview roles
          # are bounded too, so without this a PR could grant one of its own
          # preview Lambdas ssm:PutParameter on /mem9-on-aws/prod/* and overwrite
          # prod's plain-String parameters (oauth/allowed-callback-urls is an
          # open-redirect primitive; the bootstrap/consolidation task-def-arn and
          # cluster-name are consumed unvalidated by scripts/run-*-task.sh).
          # SecureString parameters are already unreachable — that write needs
          # kms:Encrypt or kms:GenerateDataKey and the ceiling admits neither.
          - Sid: DenyPutParameterOutsideApprovalRecords
            Effect: Deny
            Action:
              - ssm:PutParameter
            NotResource:
              - !Sub arn:${AWS::Partition}:ssm:${ApplicationRegion}:${AWS::AccountId}:parameter/mem9-on-aws/*/approvals/*
          # Lambda cold starts, SSM SecureStrings, and the two ECS task-definition
          # secret families use different KMS encryption contexts. Missing and
          # foreign contexts remain denied.
          - Sid: DenyKmsDecryptOutsideProjectParameterFunctionOrSecretContexts
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringNotLikeIfExists:
                "kms:EncryptionContext:PARAMETER_ARN": !Sub arn:${AWS::Partition}:ssm:${ApplicationRegion}:${AWS::AccountId}:parameter/mem9-on-aws/*
                "kms:EncryptionContext:aws:lambda:FunctionArn": !Sub arn:${AWS::Partition}:lambda:${ApplicationRegion}:${AWS::AccountId}:function:mem9-on-aws-*
                "kms:EncryptionContext:SecretARN":
                  - !Sub arn:${AWS::Partition}:secretsmanager:${ApplicationRegion}:${AWS::AccountId}:secret:mem9-on-aws-*-Mem9DbProxySecret-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${ApplicationRegion}:${AWS::AccountId}:secret:mem9-on-aws-*-Mem9DbSecret-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${ApplicationRegion}:${AWS::AccountId}:secret:mem9-on-aws-*-tenant-api-key-*
          - Sid: DenyKmsDecryptOutsideSsmSecretsManagerOrProjectLambdaPath
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringNotEqualsIfExists:
                kms:ViaService:
                  - !Sub ssm.${ApplicationRegion}.${AWS::URLSuffix}
                  - !Sub secretsmanager.${ApplicationRegion}.${AWS::URLSuffix}
              StringNotLikeIfExists:
                "kms:EncryptionContext:aws:lambda:FunctionArn": !Sub arn:${AWS::Partition}:lambda:${ApplicationRegion}:${AWS::AccountId}:function:mem9-on-aws-*
          - Sid: DenyParameterContextDecryptOutsideSsm
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              "Null":
                "kms:EncryptionContext:PARAMETER_ARN": "false"
              StringNotEqualsIfExists:
                kms:ViaService: !Sub ssm.${ApplicationRegion}.${AWS::URLSuffix}
          - Sid: DenySecretContextDecryptOutsideSecretsManager
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              "Null":
                "kms:EncryptionContext:SecretARN": "false"
              StringNotEqualsIfExists:
                kms:ViaService: !Sub secretsmanager.${ApplicationRegion}.${AWS::URLSuffix}
          # Secrets Manager's encryption context is fixed, but the boundary also
          # constrains which project role types may use that service-mediated path.
          - Sid: DenySecretContextDecryptFromNonEcsExecutionRoles
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              "Null":
                "kms:EncryptionContext:SecretARN": "false"
              ArnNotLike:
                "aws:PrincipalArn":
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9ServerExecutionRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9BootstrapExecutionRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9ConsolidationExecutionRole-*
          # Only the reviewed Lambda execution-role types may present the Lambda
          # cold-start context. Other workload roles cannot forge it.
          - Sid: DenyLambdaContextDecryptFromNonLambdaRoles
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              "Null":
                "kms:EncryptionContext:aws:lambda:FunctionArn": "false"
              ArnNotLike:
                "aws:PrincipalArn":
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9AlertRouterRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9OauthFacadeAllowAllRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9OauthFacadeFnRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9ProxyFnRole-*
          # Encryption context is caller supplied. Block function code from
          # presenting a project Lambda context directly while preserving the
          # facade's SSM-mediated decrypt and Lambda's cold-start service path.
          - Sid: DenyDirectKmsDecryptFromFunctionCode
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              "Null":
                "lambda:SourceFunctionArn": "false"
              StringNotEqualsIfExists:
                kms:ViaService: !Sub ssm.${ApplicationRegion}.${AWS::URLSuffix}
          - Sid: DenyNonShortTermMantleBearer
            Effect: Deny
            Action:
              - bedrock-mantle:CallWithBearerToken
            Resource: "*"
            Condition:
              StringNotEqualsIfExists:
                bedrock-mantle:BearerTokenType: SHORT_TERM
          # Only the VPC proxy Lambda role may expose ENI permissions to the
          # Lambda service. A second deny blocks those APIs from function code.
          - Sid: DenyEniFromNonVpcLambdaRoles
            Effect: Deny
            Action:
              - ec2:*NetworkInterface*
              - ec2:AssignPrivateIpAddresses
              - ec2:DescribeSubnets
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"
            Condition:
              ArnNotLike:
                "aws:PrincipalArn": !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mem9-on-a*-*Mem9ProxyFnRole-*
          - Sid: DenyEniFromFunctionCode
            Effect: Deny
            Action:
              - ec2:*NetworkInterface*
              - ec2:AssignPrivateIpAddresses
              - ec2:DescribeSubnets
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"
            Condition:
              "Null":
                "lambda:SourceFunctionArn": "false"

Outputs:
  PolicyArn:
    Description: ARN of the retained workload permissions boundary
    Value: !Ref WorkloadPermissionsBoundary
